    for (const s of [-1, 1]) eye(g, s * 0.42, -0.8, 0.2, 0.1, 0, 0.02);
    for (const s of [-1, 1]) dot(g, s * 0.1, -0.18, 0.04);
    smile(g, -0.62, 0.62, 0.02, 0.3, 0.08);
    ballDone(g);
  },
  gusini(g) {                                          // goose fighter jet
    for (const s of [-1, 1]) {
      g.beginPath(); g.moveTo(s * 0.5, 0.02); g.lineTo(s * 1.52, 0.46); g.lineTo(s * 1.44, 0.64); g.lineTo(s * 0.55, 0.44);
      g.closePath(); ink(g, '#B8C1CA');
    }
    ballBase(g, '#FFFFFF', '#CFCAC0');
    inside(g, () => {
      ell(g, 0, -0.88, 1.1, 0.66); g.fillStyle = '#8B5A2B'; g.fill();
      seg(g, -1, -0.42, 1, -0.42, 0.12, '#5C3A1A');
    });
    for (const s of [-1, 1]) { circ(g, s * 0.3, -0.44, 0.17); ink(g, '#9ED8F0', 0.07); }
    for (const s of [-1, 1]) beady(g, s * 0.28, -0.02, 0.08);
    ell(g, 0, 0.4, 0.46, 0.26); ink(g, '#FF9F1C');
    seg(g, -0.4, 0.42, 0.4, 0.42, 0.05);
    for (const s of [-1, 1]) dot(g, s * 0.1, 0.3, 0.03);
    ballDone(g);
  },
  saturnita(g) {                                       // cow on planet Saturn
    const ring = front => {
      g.save(); g.rotate(-0.22);
      g.beginPath(); g.ellipse(0, 0.12, 1.5, 0.36, 0, front ? 0 : Math.PI, front ? Math.PI : TAU);
      g.lineWidth = 0.27; g.lineCap = 'butt'; g.strokeStyle = INK; g.stroke();
      g.lineWidth = 0.17; g.strokeStyle = '#EBBE72'; g.stroke();
      g.restore();
    };
    ring(false);
    for (const s of [-1, 1]) {
      g.beginPath(); g.moveTo(s * 0.32, -0.88); g.quadraticCurveTo(s * 0.62, -1.3, s * 0.82, -1.1);
      g.quadraticCurveTo(s * 0.6, -1.0, s * 0.56, -0.8); g.closePath(); ink(g, '#F6EBD6', 0.05);
      ell(g, s * 0.98, -0.38, 0.26, 0.13, s * 0.3); ink(g, '#F2E4D8', 0.05);
    }
    ballBase(g, '#F8DBA6', '#C98A4E');
    inside(g, () => {
      g.fillStyle = 'rgba(175,105,45,0.32)';
      g.fillRect(-1, -0.66, 2, 0.12); g.fillRect(-1, 0.6, 2, 0.14);
      ell(g, 0, 0.02, 0.64, 0.68); g.fillStyle = '#FBF6EF'; g.fill();
      g.fillStyle = '#2E2A2A';
      ell(g, -0.42, -0.42, 0.2, 0.15, 0.4); g.fill();
      ell(g, 0.48, 0.0, 0.14, 0.2, -0.3); g.fill();
    });
    for (const s of [-1, 1]) beady(g, s * 0.26, -0.16, 0.09);
    ell(g, 0, 0.36, 0.42, 0.26); ink(g, '#F7A1B0', 0.06);
    for (const s of [-1, 1]) dot(g, s * 0.14, 0.36, 0.05);
    ballDone(g);
    ring(true);
  },
};

/* =====================================================================
   RENDERING
   ===================================================================== */

// Each racer is pre-rendered once per size (and once grayed out for the strip).
const sprites = new Map();

function getSprite(def, r, gray = false) {
  const key = `${def.id}|${r}|${gray ? 1 : 0}`;
  let s = sprites.get(key);
  if (s) return s;
  const size = r * 2 * 1.75;                       // room for fins, ears, wings and rings
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(size * scale);
  const g = c.getContext('2d');
  if (gray) {
    g.filter = 'grayscale(1) brightness(0.75)';
    g.drawImage(getSprite(def, r).canvas, 0, 0);
  } else {
    g.scale(c.width / size, c.height / size);
    g.translate(size / 2, size / 2);
    g.scale(r, r);
    g.lineJoin = 'round';
    FACES[def.id](g);
  }
  s = { canvas: c, size };
  sprites.set(key, s);
  return s;
}

// Soft round shadow under every marble (cached).
function getShadow() {
  const key = 'shadow';
  let s = sprites.get(key);
  if (s) return s;
  const size = R * 3;
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(size * scale);
  const g = c.getContext('2d');
  g.scale(c.width / size, c.height / size);
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, 'rgba(70,40,30,0.35)');
  gr.addColorStop(0.55, 'rgba(70,40,30,0.25)');
  gr.addColorStop(1, 'rgba(70,40,30,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, size, size);
  s = { canvas: c, size };
  sprites.set(key, s);
  return s;
}

// A swinging pizza (cached, rotated when drawn).
function getPizza() {
  let s = sprites.get('pizza');
  if (s) return s;
  const r = TUNING.pizzaR, size = r * 2 + 6;
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(size * scale);
  const g = c.getContext('2d');
  g.scale(c.width / size, c.height / size);
  g.translate(size / 2, size / 2);
  circ(g, 0, 0, r); g.fillStyle = '#E7B867'; g.fill(); g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
  circ(g, 0, 0, r * 0.78); g.fillStyle = '#D9442B'; g.fill();
  g.fillStyle = '#FCE38A';
  for (const [x, y, rr] of [[-4, -3, 4], [4, 2, 4.5], [-1, 5, 3.5], [5, -5, 3]]) { circ(g, x, y, rr); g.fill(); }
  g.fillStyle = '#A8302A';
  for (const [x, y] of [[-5, 3], [3, -2], [1, 6], [-3, -6]]) { circ(g, x, y, 2.2); g.fill(); }
  s = { canvas: c, size };
  sprites.set('pizza', s);
  return s;
}

// Sky, clay clouds and sun, Tuscan hills, the hook lettering, the racer-strip plaque.
let backdrop = null;
function buildBackdrop() {
  backdrop = document.createElement('canvas');
  backdrop.width = canvas.width;
  backdrop.height = canvas.height;
  const g = backdrop.getContext('2d');
  g.scale(scale, scale);
  const sky = g.createLinearGradient(0, L.panelTop, 0, L.panelBottom);
  sky.addColorStop(0, '#7EC8F0');
  sky.addColorStop(0.55, '#C3EAF8');
  sky.addColorStop(1, '#FFE3BC');
  g.fillStyle = sky;
  g.fillRect(0, 0, LW, LH);

  // Clay sun (right margin, above TikTok's buttons)
  const sx = 512, sy = L.trackTop + 64;
  g.fillStyle = '#FFB938';
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU;
    ell(g, sx + Math.cos(a) * 44, sy + Math.sin(a) * 44, 11, 6, a); g.fill();
  }
  circ(g, sx, sy, 34);
  const sg = g.createRadialGradient(sx - 10, sy - 12, 4, sx, sy, 36);
  sg.addColorStop(0, '#FFF0A0'); sg.addColorStop(1, '#FFC23A');
  g.fillStyle = sg; g.fill();
  g.lineWidth = 3; g.strokeStyle = 'rgba(58,36,32,0.5)'; g.stroke();

  // Clay clouds
  const cloud = (x, y, k) => {
    g.save();
    g.shadowColor = 'rgba(80,110,140,0.25)'; g.shadowBlur = blur(6); g.shadowOffsetY = 3 * scale;
    g.fillStyle = '#FFFFFF';
    for (const [dx, dy, r] of [[-26, 4, 16], [-8, -8, 20], [14, -4, 18], [30, 6, 13], [0, 8, 16]]) { circ(g, x + dx * k, y + dy * k, r * k); g.fill(); }
    g.restore();
  };
  cloud(60, L.panelTop + 186, 0.8);
  cloud(470, L.panelTop + 200, 0.7);
  cloud(140, L.trackTop + 300, 1.0);
  cloud(380, L.trackTop + 150, 0.9);

  // Rolling Tuscan hills with cypress trees and a tiny leaning tower
  const hill = (y0, amp, color, phase) => {
    g.beginPath(); g.moveTo(0, L.panelBottom);
    for (let x = 0; x <= LW; x += 10) g.lineTo(x, y0 + Math.sin(x * 0.012 + phase) * amp);
    g.lineTo(LW, L.panelBottom); g.closePath(); g.fillStyle = color; g.fill();
  };
  hill(L.panelBottom - 150, 18, '#B9E28C', 0.5);
  for (const [x, h] of [[90, 46], [112, 36], [400, 50], [425, 38]]) {
    const y = L.panelBottom - 150 + Math.sin(x * 0.012 + 0.5) * 18;
    ell(g, x, y - h / 2, 7, h / 2); g.fillStyle = '#4E8A3E'; g.fill();
  }
  g.save(); g.translate(300, L.panelBottom - 160); g.rotate(0.12);       // leaning tower
  g.fillStyle = '#F4EBDD'; g.fillRect(-9, -58, 18, 58);
  g.strokeStyle = 'rgba(58,36,32,0.35)'; g.lineWidth = 1.2;
  for (let y = -50; y < 0; y += 9) { g.beginPath(); g.moveTo(-9, y); g.lineTo(9, y); g.stroke(); }
  g.strokeRect(-9, -58, 18, 58);
  g.restore();
  hill(L.panelBottom - 95, 14, '#97D06A', 2.0);

  // Soft cream board behind the track so the ramps read clearly
  g.fillStyle = 'rgba(255,250,240,0.42)';
  roundRect(g, AX0 - 4, L.trackTop - 6, AX1 - AX0 + 8, L.panelBottom - L.trackTop + 6, 18);
  g.fill();

  // Clay speckle texture over everything
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 900; i++) {
    g.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.10)' : 'rgba(90,60,40,0.06)';
    circ(g, rnd() * LW, L.panelTop + rnd() * (L.panelBottom - L.panelTop), 0.6 + rnd() * 1.4); g.fill();
  }

  // The hook, in chunky clay letters
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  fitFont(g, HOOK[0], 260, 19);
  g.lineJoin = 'round'; g.lineWidth = 4; g.strokeStyle = CREAM; g.strokeText(HOOK[0], L.cx, L.hudY + 1);
  g.fillStyle = INK; g.fillText(HOOK[0], L.cx, L.hudY + 1);
  fitFont(g, HOOK[1], 470, 42);
  clayText(g, HOOK[1], L.cx, L.title2, '#FFD23F', 5, 8);
  fitFont(g, HOOK[2], 480, 46);
  clayText(g, HOOK[2], L.cx, L.title3, '#FF6FA8', 5, 8);

  // Plaque behind the racer strip
  g.save();
  g.shadowColor = 'rgba(70,40,30,0.3)'; g.shadowBlur = blur(5); g.shadowOffsetY = 3 * scale;
  roundRect(g, 14, L.stripY - 20, LW - 28, 40, 20);
  g.fillStyle = '#FFF1D6'; g.fill();
  g.restore();
  roundRect(g, 14, L.stripY - 20, LW - 28, 40, 20);
  g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
}

// Thick clay line (ramps, walls): drop shadow, outline, body, highlight.
function clayLine(g, pts, color, w, soft) {
  const path = () => {
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  };
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.save();
  if (soft) { g.shadowColor = 'rgba(70,40,30,0.35)'; g.shadowBlur = blur(6); g.shadowOffsetX = 2 * scale; g.shadowOffsetY = 4 * scale; }
  else { g.translate(2, 4); path(); g.strokeStyle = 'rgba(70,40,30,0.25)'; g.lineWidth = w + 3; g.stroke(); g.translate(-2, -4); }
  path(); g.strokeStyle = INK; g.lineWidth = w + 3; g.stroke();
  g.restore();
  path(); g.strokeStyle = color; g.lineWidth = w; g.stroke();
  g.save(); g.translate(0, -w * 0.18);
  path(); g.strokeStyle = lighten(color, 0.4); g.lineWidth = w * 0.3; g.stroke();
  g.restore();
}

function clayBall(g, x, y, r, color, soft) {
  g.save();
  if (soft) { g.shadowColor = 'rgba(70,40,30,0.35)'; g.shadowBlur = blur(4); g.shadowOffsetX = 1.5 * scale; g.shadowOffsetY = 3 * scale; }
  circ(g, x, y, r);
  const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  gr.addColorStop(0, lighten(color, 0.35));
  gr.addColorStop(1, color);
  g.fillStyle = gr; g.fill();
  g.restore();
  circ(g, x, y, r); g.lineWidth = 1.8; g.strokeStyle = INK; g.stroke();
}

// One ramp with its static features (meatballs, espresso pad, stairs).
function drawRamp(g, rp, soft) {
  if (rp.stairs) {                                       // spaghetti stairs: solid clay steps
    const pts = rp.stairs, base = Math.max(...pts.map(p => p[1])) + 8;
    g.save();
    if (soft) { g.shadowColor = 'rgba(70,40,30,0.35)'; g.shadowBlur = blur(6); g.shadowOffsetX = 2 * scale; g.shadowOffsetY = 4 * scale; }
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) g.lineTo(p[0], p[1]);
    g.lineTo(pts[pts.length - 1][0], base); g.lineTo(pts[0][0], base); g.closePath();
    g.fillStyle = '#F7D774'; g.fill();
    g.restore();
    g.lineWidth = 2.5; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke();
    g.strokeStyle = 'rgba(214,150,40,0.7)'; g.lineWidth = 1.6;          // spaghetti squiggles
    for (let i = 0; i < pts.length - 1; i += 2) {
      const [x1, y1] = pts[i], [x2] = pts[i + 1];
      g.beginPath();
      for (let x = Math.min(x1, x2) + 4; x < Math.max(x1, x2) - 4; x += 3) g.lineTo(x, y1 + 9 + Math.sin(x * 0.6) * 2.5);
      g.stroke();
    }
    clayLine(g, pts, rp.color, 6, false);
    return;
  }
  for (const part of rp.parts) {
    clayLine(g, [rampPt(rp, part[0]), rampPt(rp, part[1])], rp.color, T, soft);
  }
  if (rp.boost) {                                        // espresso pad
    const a = rampPt(rp, rp.boost[0], T / 2 - 1), b = rampPt(rp, rp.boost[1], T / 2 - 1);
    g.lineCap = 'round';
    seg(g, a[0], a[1], b[0], b[1], 7, INK);
    seg(g, a[0], a[1], b[0], b[1], 5, '#5A3420');
  }
  for (const m of rp.meats) {                            // meatballs with sauce
    clayBall(g, m.x, m.y, m.r, '#9A5434', soft);
    ell(g, m.x - 1, m.y - m.r * 0.45, m.r * 0.7, m.r * 0.38); g.fillStyle = '#D93A2B'; g.fill();
    dot(g, m.x + 3, m.y + 2, 1.6, '#6E3420');
  }
}

/* Everything on a floor that doesn't move, drawn once into its own canvas
   (track units, with a margin above y = 0 for the starting box's awning). */
const FLOOR_PAD = 24;
function renderFloor(F) {
  const c = F.canvas || document.createElement('canvas');
  c.width = Math.ceil(LW * scale);
  c.height = Math.ceil((TH + FLOOR_PAD) * scale);
  const g = c.getContext('2d');
  g.setTransform(scale, 0, 0, scale, 0, FLOOR_PAD * scale);
  g.clearRect(-10, -FLOOR_PAD, LW + 20, TH + FLOOR_PAD + 10);
  F.canvas = c;

  // Olives
  for (const p of F.pegs) {
    clayBall(g, p.x, p.y, p.r, '#8DB33A', true);
    dot(g, p.x + 1.5, p.y - 1, 2.6, '#E5533D');
  }
  if (F.deflector) {
    const d = F.deflector;
    clayLine(g, [[d.x1, d.y1], [d.x2, d.y2]], '#F4A261', T, true);
  }
  // Ramps (a ramp mid-flip is drawn live instead)
  for (const rp of F.ramps) if (rp !== F.flipping) drawRamp(g, rp, true);
  // Trapdoor hinges and the hole they cover
  for (const tr of F.traps) {
    const ex = tr.hx + Math.cos(tr.closed) * tr.len, ey = tr.hy + Math.sin(tr.closed) * tr.len;
    g.save(); g.setLineDash([3, 3]);
    seg(g, tr.hx, tr.hy + 6, ex, ey + 6, 1.5, 'rgba(58,36,32,0.5)');
    g.restore();
  }
  // Pizza hangers
  for (const p of F.pends) {
    g.fillStyle = '#7A4A2A'; roundRect(g, p.px - 6, p.py - 4, 12, 7, 3); g.fill();
    g.lineWidth = 1.5; g.strokeStyle = INK; g.stroke();
  }

  // Walls: terracotta clay pillars, with the finish door cut into the left one
  const D = F.door;
  const wall = (x, y1, y2) => clayLine(g, [[x, y1], [x, y2]], '#E07A5F', 14, true);
  wall(AX0 - 3, -2, D.top - 4);
  wall(AX0 - 3, D.bot + 6, TH + 20);
  wall(AX1 + 3, -2, TH + 20);
  // Finish door: glowing arch + checkered flag
  g.save();
  roundRect(g, -6, D.top - 6, 30, D.bot - D.top + 8, 10);
  const glow = g.createLinearGradient(0, D.top, 0, D.bot);
  glow.addColorStop(0, '#FFF6C8'); glow.addColorStop(1, '#FFD36B');
  g.fillStyle = glow; g.fill();
  g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
  g.restore();
  const fx = AX0 + 10, fy = D.top - 30;
  seg(g, fx, fy, fx, D.top - 2, 2.5, INK);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 4; j++) {
    g.fillStyle = (i + j) % 2 ? '#FFFFFF' : '#2B2B2B';
    g.fillRect(fx + 1 + j * 5, fy + i * 5, 5, 5);
  }
  g.lineWidth = 1.2; g.strokeStyle = INK; g.strokeRect(fx + 1, fy, 20, 15);
  g.font = `700 9px ${CLAY}`; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.lineWidth = 3; g.strokeStyle = CREAM; g.strokeText('FINISH', fx + 24, fy + 8);
  g.fillStyle = INK; g.fillText('FINISH', fx + 24, fy + 8);

  // Starting box: posts and a striped café awning
  const P = F.pen;
  clayLine(g, [[P.x0 - T / 2, 2], [P.x0 - T / 2, P.y]], '#F4A261', T, true);
  clayLine(g, [[P.x1 + T / 2, 2], [P.x1 + T / 2, P.y]], '#F4A261', T, true);
  const aw0 = P.x0 - 14, aw1 = P.x1 + 14, ay = -14, n = 12, sw = (aw1 - aw0) / n;
  for (let i = 0; i < n; i++) {
    g.beginPath();
    g.moveTo(aw0 + i * sw, ay); g.lineTo(aw0 + (i + 1) * sw, ay);
    g.lineTo(aw0 + (i + 1) * sw, ay + 10); g.arc(aw0 + (i + 0.5) * sw, ay + 10, sw / 2, 0, Math.PI);
    g.closePath(); g.fillStyle = i % 2 ? '#FFFFFF' : '#E63946'; g.fill();
  }
  g.beginPath(); g.moveTo(aw0, ay);
  for (let i = 0; i < n; i++) g.arc(aw0 + (i + 0.5) * sw, ay + 10, sw / 2, Math.PI, 0, true);
  g.lineTo(aw1, ay); g.closePath();
  g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
}

// Moving parts of a floor: the gate, trapdoors, pizzas, espresso arrows, door, a flipping ramp.
function drawFloorLive(F) {
  const P = F.pen;
  if (P.open < 1) {
    clayLine(ctx, [[P.x0 - T / 2, P.y], [lerp(TCX, P.x0 - T / 2, P.open), P.y]], '#F4A261', T, false);
    clayLine(ctx, [[lerp(TCX, P.x1 + T / 2, P.open), P.y], [P.x1 + T / 2, P.y]], '#F4A261', T, false);
  }
  for (const tr of F.traps) {
    const ang = S.floor === F ? tr.ang : tr.closed;
    clayLine(ctx, [[tr.hx, tr.hy], [tr.hx + Math.cos(ang) * tr.len, tr.hy + Math.sin(ang) * tr.len]], '#D99A5B', T, false);
    dot(ctx, tr.hx, tr.hy, 3, INK);
  }
  const pz = getPizza();
  for (const p of F.pends) {
    seg(ctx, p.px, p.py, p.x, p.y, 1.6, '#7A4A2A');
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(-p.ang * 2);
    ctx.drawImage(pz.canvas, -pz.size / 2, -pz.size / 2, pz.size, pz.size);
    ctx.restore();
  }
  if (F.flipping) drawRamp(ctx, F.flipping, false);
  for (const rp of F.ramps) {                           // espresso chevrons slide downhill
    if (!rp.boost) continue;
    const down = Math.sin(rp.ang) > 0 ? 1 : -1, len = rp.boost[1] - rp.boost[0];
    ctx.strokeStyle = '#FFE8C2'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    for (let k = 0; k < 4; k++) {
      const off = ((S.time * 60 + k * len / 4) % len);
      const s = down > 0 ? rp.boost[0] + off : rp.boost[1] - off;
      const [x, y] = rampPt(rp, s, T / 2 - 1);
      const c = Math.cos(rp.ang) * down, sn = Math.sin(rp.ang) * down;
      ctx.beginPath();
      ctx.moveTo(x - c * 3 - sn * 2.5, y - sn * 3 + c * 2.5);
      ctx.lineTo(x, y);
      ctx.lineTo(x - c * 3 + sn * 2.5, y - sn * 3 - c * 2.5);
      ctx.stroke();
    }
  }
  const D = F.door;
  if (D.close > 0) {                                    // the door slams shut
    const h = (D.bot - D.top + 6) * D.close;
    ctx.fillStyle = '#B5562F';
    roundRect(ctx, -2, D.top - 4, 26, h, 6); ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
    ctx.strokeStyle = 'rgba(58,36,32,0.4)'; ctx.lineWidth = 1.5;
    for (let y = D.top + 6; y < D.top - 4 + h - 3; y += 8) { ctx.beginPath(); ctx.moveTo(2, y); ctx.lineTo(20, y); ctx.stroke(); }
  }
}

function drawRacer(b) {
  const sp = getSprite(b.def, R), sh = getShadow();
  ctx.save();
  if (b.ghostT > 0) ctx.globalAlpha = 0.55;
  ctx.drawImage(sh.canvas, b.x - sh.size / 2 + 3, b.y - sh.size / 2 + 5, sh.size, sh.size);
  ctx.translate(b.x, b.y);
  if (b.squash > 0.02) {
    ctx.rotate(b.squashAng);
    ctx.scale(1 - 0.3 * b.squash, 1 + 0.2 * b.squash);
    ctx.rotate(-b.squashAng);
  }
  ctx.rotate(b.lean);
  ctx.drawImage(sp.canvas, -sp.size / 2, -sp.size / 2, sp.size, sp.size);
  ctx.restore();
  if (b.frozenT > 0) {                                  // stopped in time: icy bubble + clock
    circ(ctx, b.x, b.y, R + 3);
    ctx.fillStyle = 'rgba(160,225,255,0.45)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#E8FAFF'; ctx.stroke();
    seg(ctx, b.x, b.y - R - 10, b.x, b.y - R - 15, 1.5, INK);
    circ(ctx, b.x, b.y - R - 12, 5); ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke();
  }
  if (b.slowT > 0) {
    circ(ctx, b.x, b.y, R + 4); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(168,121,214,0.8)'; ctx.stroke();
  }
}

// An eliminated marble gets squashed flat into a clay pancake.
function drawLoser(b) {
  const t = clamp(b.outT / 0.35, 0, 1), sp = getSprite(b.def, R);
  const sx = 1 + 0.9 * easeOut(t), sy = 1 - 0.78 * easeOut(t);
  ctx.save();
  ctx.translate(b.x, b.y + R * (1 - sy));
  ctx.globalAlpha = b.outT > 1.1 ? clamp(1 - (b.outT - 1.1) / 0.4, 0, 1) : 1;
  ctx.scale(sx, sy);
  ctx.drawImage(sp.canvas, -sp.size / 2, -sp.size / 2, sp.size, sp.size);
  ctx.restore();
  if (b.outT < 1.2) {
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const pop = clamp(b.outT / 0.15, 0, 1);
    ctx.translate(clamp(b.x, 60, 440), b.y - 30);
    ctx.rotate(-0.12);
    ctx.scale(0.5 + 0.5 * easeOutBack(pop), 0.5 + 0.5 * easeOutBack(pop));
    ctx.font = `700 26px ${CLAY}`;
    clayText(ctx, 'OUT!', 0, 0, '#FF4D4D', 3, 6);
    ctx.restore();
  }
}

function drawFloor(F, oy) {
  ctx.save();
  ctx.translate(0, L.trackTop + oy);
  ctx.drawImage(F.canvas, 0, -FLOOR_PAD, LW, TH + FLOOR_PAD);
  drawFloorLive(F);
  ctx.restore();
}

function drawRacers() {
  let lead = null, last = null;
  if (S.phase === 'race') {
    const order = standings();
    if (order.length > 1) { lead = order[0]; last = order[order.length - 1]; }
  }
  for (const h of S.hazards) {                           // banana peels
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(0.3);
    ell(ctx, 0, 0, 11, 5); ink(ctx, '#F7D44A', 1.5);
    ell(ctx, -6, -3, 5, 3, -0.8); ink(ctx, '#F7D44A', 1.5);
    ell(ctx, 6, -3, 5, 3, 0.8); ink(ctx, '#F7D44A', 1.5);
    ctx.restore();
  }
  for (const b of S.racers) {                            // speed trails
    if (b.trail.length < 2) continue;
    for (let i = 0; i < b.trail.length; i++) {
      ctx.globalAlpha = (i + 1) / b.trail.length * 0.35;
      circ(ctx, b.trail[i][0], b.trail[i][1], R * (0.5 + 0.5 * (i + 1) / b.trail.length));
      ctx.fillStyle = b.def.color; ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (last && S.elim) {                                  // whoever is last right now: danger ring
    circ(ctx, last.x, last.y, R + 5 + Math.sin(S.time * 10) * 1.5);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(230,57,70,0.85)'; ctx.stroke();
  }
  const pen = S.phase === 'intro' || S.phase === 'shift';
  for (const b of S.racers) {
    if (b.state === 'race') drawRacer(b);
    else if (b.state === 'pen' && pen) {
      const bob = Math.sin(S.time * 7 + b.idx * 1.7) * 1.2;     // fidgeting in the box
      b.squash = 0;
      const y = b.y;
      b.y += bob; drawRacer(b); b.y = y;
    }
  }
  for (const b of S.losers) if (b.state === 'out' && b.outT < 1.6) drawLoser(b);
  for (const bm of S.bombs) {                            // Bombardiro's bombs
    ctx.save(); ctx.translate(bm.x, bm.y);
    ell(ctx, 0, 0, 6, 9); ink(ctx, '#3B3B3B', 1.5);
    ctx.fillStyle = '#B33A2A'; ctx.fillRect(-6, -10, 12, 3);
    ctx.restore();
  }
  if (lead) drawCrown(lead.x, lead.y - R - 9);
}

function drawCrown(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(-9, 4); ctx.lineTo(-9, -4); ctx.lineTo(-4.5, 0); ctx.lineTo(0, -6); ctx.lineTo(4.5, 0); ctx.lineTo(9, -4); ctx.lineTo(9, 4);
  ctx.closePath();
  ctx.fillStyle = '#FFD23F'; ctx.fill();
  ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
}

function drawFx() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of S.fx) {
    const t = 1 - f.life / f.max;      // 0 → 1 over the effect's life
    if (f.kind === 'ring') {
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.width * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0, f.r0 + (f.r1 - f.r0) * easeOut(t)), 0, TAU); ctx.stroke();
    } else if (f.kind === 'spark') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = f.color;
      circ(ctx, f.x, f.y, f.size); ctx.fill();
    } else if (f.kind === 'puff') {
      ctx.globalAlpha = (1 - t) * 0.9;
      circ(ctx, f.x, f.y, f.size * (0.6 + t)); ctx.fillStyle = f.color; ctx.fill();
      ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(58,36,32,0.35)'; ctx.stroke();
    } else if (f.kind === 'confetti') {
      ctx.globalAlpha = t < 0.85 ? 1 : (1 - t) / 0.15;
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
      ctx.fillStyle = f.color; ctx.fillRect(-f.size / 2, -f.size / 4, f.size, f.size / 2);
      ctx.restore();
    }
  }
  for (const f of S.fx) {
    if (f.kind !== 'float') continue;
    const t = 1 - f.life / f.max;
    const pop = t < 0.12 ? 0.5 + 0.5 * easeOutBack(t / 0.12) : 1;
    ctx.globalAlpha = t < 0.75 ? 1 : (1 - t) / 0.25;
    const y = f.y - 30 * easeOut(t), x = clamp(f.x, 110, 390);
    fitFont(ctx, f.text, 320, f.size * pop);
    clayText(ctx, f.text, x, y, f.color, 2, 5);
  }
  ctx.restore();
}

// The 12 racers along the top: in the race, safe this floor, or OUT.
function drawStrip() {
  const n = S.racers.length, gap = (LW - 60) / (n - 1), r = 14;
  for (const b of S.racers) {
    const x = 30 + b.idx * gap, y = L.stripY;
    const out = b.state === 'out' && !(S.losers.includes(b) && b.outT < 0.35);
    const sp = getSprite(b.def, r, out);
    ctx.drawImage(sp.canvas, x - sp.size / 2, y - sp.size / 2, sp.size, sp.size);
    if (out) {
      seg(ctx, x - 9, y - 9, x + 9, y + 9, 4, '#E63946');
      seg(ctx, x + 9, y - 9, x - 9, y + 9, 4, '#E63946');
    } else if (b === S.winner && (S.phase === 'win' || S.phase === 'end')) {
      drawCrown(x, y - r - 5);
    } else if (b.state === 'done' && S.phase === 'race') {
      circ(ctx, x + 10, y + 10, 6); ink(ctx, '#3FB950', 1.5);
      ctx.beginPath(); ctx.moveTo(x + 7, y + 10); ctx.lineTo(x + 9.5, y + 12.5); ctx.lineTo(x + 13.5, y + 7.5);
      ctx.lineWidth = 1.8; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
    }
  }
}

// Round countdown (left pill) and floor counter (right pill).
function drawHud() {
  const secs = Math.max(0, Math.ceil(S.clock));
  const text = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  const urgent = !S.timeUp && S.clock <= 10;
  const pulse = urgent ? 1 + 0.12 * Math.pow(S.clock - Math.floor(S.clock), 3) : 1;
  const pill = (x, color, w) => {
    roundRect(ctx, x - w / 2, L.hudY - 18 + 4, w, 36, 18); ctx.fillStyle = INK; ctx.fill();
    roundRect(ctx, x - w / 2, L.hudY - 18, w, 36, 18); ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  };
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(66, 0); ctx.translate(0, L.hudY); ctx.scale(pulse, pulse); ctx.translate(0, -L.hudY);
  pill(0, urgent || S.timeUp ? '#E63946' : '#F28C28', 96);
  ctx.font = `700 24px ${CLAY}`;
  clayText(ctx, text, 0, L.hudY + 1, CREAM, 2, 4);
  ctx.restore();
  const left = aliveRacers().length;
  pill(474, '#4FA3E0', 104);
  ctx.font = `700 15px ${CLAY}`;
  const label = S.timeUp || S.phase === 'win' ? 'WINNER' : left === 2 ? 'FINAL' : `FLOOR ${S.heat}`;
  clayText(ctx, label, 474, L.hudY - 6, CREAM, 1.5, 3.5);
  ctx.font = `700 11px ${CLAY}`;
  clayText(ctx, `${left} LEFT`, 474, L.hudY + 9, '#FFE27A', 1, 3);
  ctx.restore();
}

// Clay plaque banners: floor name, TRACK FLIP, OUT!, WINNER!
function drawBanner() {
  const B = S.banner;
  if (!B) return;
  const age = B.max - B.life;
  const fadeOut = Math.min(1, B.life / 0.35);
  const pop = age < 0.2 ? 0.3 + 0.7 * easeOutBack(age / 0.2) : 1;
  const style = {
    floor: { color: '#FFE27A', w: 360, h: 92, y: 0.4 },
    flip: { color: '#C9A3F0', w: 300, h: 78, y: 0.09 },
    out: { color: '#FF8A8A', w: 420, h: 118, y: 0.42 },
    win: { color: '#FFD23F', w: 440, h: B.face ? 140 : 110, y: 0.52 },
  }[B.kind];
  ctx.save();
  ctx.globalAlpha = fadeOut;
  ctx.translate(L.cx - 18, L.trackTop + TH * style.y);
  ctx.scale(pop, pop);
  const { w, h } = style;
  roundRect(ctx, -w / 2, -h / 2 + 6, w, h, 26); ctx.fillStyle = INK; ctx.fill();
  roundRect(ctx, -w / 2, -h / 2, w, h, 26); ctx.fillStyle = style.color; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  roundRect(ctx, -w / 2 + 8, -h / 2 + 6, w - 16, h * 0.32, 18);
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();

  let tx = 0;
  const faces = B.faces || (B.face ? [B.face] : []);
  if (faces.length) {                                   // the racer(s) it's about
    const fr = B.kind === 'win' ? 30 : 24;
    faces.forEach((def, i) => {
      const sp = getSprite(def, fr);
      const fx = -w / 2 + 18 + fr + i * fr * 1.3;
      ctx.drawImage(sp.canvas, fx - sp.size / 2, -sp.size / 2 + (i ? 8 : 0), sp.size, sp.size);
    });
    tx = (fr + 8 + (faces.length - 1) * fr * 0.65);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tw = w - 40 - tx * 1.2;
  if (B.kind === 'win' && B.face) {                     // WINNER! small on top, the name big
    fitFont(ctx, B.text, tw, 30);
    clayText(ctx, B.text, tx * 0.6, -h * 0.24, '#FF8A1F', 3, 6);
    fitFont(ctx, B.sub.toUpperCase(), tw, B.big ? 44 : 38);
    clayText(ctx, B.sub.toUpperCase(), tx * 0.6, h * 0.14, '#FF6FA8', 4, 7);
    ctx.restore();
    return;
  }
  fitFont(ctx, B.text, tw, B.kind === 'win' ? 50 : B.kind === 'out' ? 48 : 40);
  clayText(ctx, B.text, tx * 0.6, B.sub ? -h * 0.14 : 0, B.kind === 'out' ? '#FF4D4D' : B.kind === 'flip' ? '#FFFFFF' : '#FF8A1F', 4, 7);
  if (B.sub) {
    fitFont(ctx, B.sub, tw, 20);
    ctx.fillStyle = INK;
    ctx.fillText(B.sub, tx * 0.6, h * 0.25);
  }
  ctx.restore();
}

function draw() {
  if (!canvas.width || !canvas.height || !backdrop.width) return;   // page not laid out yet
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(backdrop, 0, 0);
  const sx = S.shake ? rand(-1, 1) * S.shake : 0, sy = S.shake ? rand(-1, 1) * S.shake : 0;
  ctx.setTransform(scale, 0, 0, scale, sx * scale, sy * scale);

  // The track (clipped to its area so sliding floors never cover the hook)
  ctx.save();
  ctx.beginPath(); ctx.rect(0, L.trackTop - FLOOR_PAD, LW, L.panelBottom - L.trackTop + FLOOR_PAD); ctx.clip();
  if (S.phase === 'shift' && S.prevFloor) {
    const p = easeInOut(clamp(S.phaseT / SHIFT_DUR, 0, 1)), off = (TH + FLOOR_PAD + 20) * p;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, L.stripY + 22, LW, L.panelBottom - L.stripY - 22); ctx.clip();
    drawFloor(S.prevFloor, -off);
    ctx.restore();
    drawFloor(S.floor, TH + FLOOR_PAD + 20 - off);
    ctx.save(); ctx.translate(0, L.trackTop + TH + FLOOR_PAD + 20 - off);
    for (const b of aliveRacers()) drawRacer(b);
    ctx.restore();
  } else {
    drawFloor(S.floor, 0);
    ctx.save(); ctx.translate(0, L.trackTop);
    drawRacers();
    drawFx();
    if (S.phase === 'win' || S.phase === 'end') drawChampion();
    ctx.restore();
  }
  ctx.restore();

  drawStrip();
  drawHud();
  if (S.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${S.flash})`;
    ctx.fillRect(-20, -20, LW + 40, LH + 40);
  }
  drawBanner();

  // Black bands (drawn last, unshaken, so nothing spills into TikTok's UI zones)
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, LW, L.panelTop);
  ctx.fillRect(0, L.panelBottom, LW, LH - L.panelBottom);
}

// The winner, big, spinning in a spotlight above the WINNER plaque.
function drawChampion() {
  const w = S.winner;
  if (!w) return;
  const age = S.phase === 'win' ? S.phaseT : 1;
  const k = easeOutBack(clamp(age / 0.5, 0, 1));
  const r = 52, sp = getSprite(w.def, r);
  const x = TCX, y = TH * 0.23;
  ctx.save();
  ctx.globalAlpha = 0.5 * k;
  const gl = ctx.createRadialGradient(x, y, 0, x, y, 110);
  gl.addColorStop(0, '#FFF6C8'); gl.addColorStop(1, 'rgba(255,246,200,0)');
  ctx.fillStyle = gl; circ(ctx, x, y, 110); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.translate(x, y + Math.sin(S.time * 3) * 4);
  ctx.rotate(Math.sin(S.time * 2) * 0.12);
  ctx.scale(k, k);
  ctx.drawImage(sp.canvas, -sp.size / 2, -sp.size / 2, sp.size, sp.size);
  ctx.restore();
  if (k > 0.5) drawCrownBig(x, y - r - 16 + Math.sin(S.time * 3) * 4);
}
function drawCrownBig(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.scale(2.2, 2.2);
  ctx.translate(-x, -y); drawCrown(x, y);
  ctx.restore();
}

/* =====================================================================
   VIDEO RECORDING
   Records one full round straight from the canvas (1080×1920, 60fps, with
   sound), keeps going a few seconds into the freeze, then saves the file.
   ===================================================================== */

const params = new URLSearchParams(location.search);
// ?upload=/path  → POST the finished video to this same-origin path instead of
// downloading it (used by tools/render.py). ?autorecord → start on load.
const UPLOAD_PATH = /^\/(?!\/)/.test(params.get('upload') || '') ? params.get('upload') : null;

const Recorder = {
  on: false, rec: null, chunks: [], tail: 0, startedAt: 0, frames: 0,
  TAIL_SECONDS: 3.5,        // how long to keep filming the frozen end screen

  // Best format this browser can record: MP4 (H.264/AAC) first, WebM fallback.
  pickMime() {
    const types = [
      'video/mp4;codecs=avc1.64002A,mp4a.40.2',
      'video/mp4;codecs=avc1,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm',
    ];
    return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  },

  start() {
    if (this.on) return;
    if (!window.MediaRecorder || !canvas.captureStream) {
      alert("This browser can't record video. Try Chrome or Safari on a computer.");
      return;
    }
    Sound.unlock();
    this.on = true;
    resize();                 // lock the canvas to 1080×1920
    startRound();
    draw();

    const stream = canvas.captureStream(60);
    const audio = Sound.recordStream();
    if (audio) audio.getAudioTracks().forEach(t => stream.addTrack(t));

    const mimeType = this.pickMime();
    const opts = { videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 192_000 };
    if (mimeType) opts.mimeType = mimeType;
    this.rec = new MediaRecorder(stream, opts);
    this.chunks = [];
    this.rec.ondataavailable = e => { if (e.data.size) this.chunks.push(e.data); };
    this.rec.onstop = () => this.save();
    this.rec.start(1000);

    this.tail = this.TAIL_SECONDS;
    this.startedAt = performance.now();
    this.frames = 0;
    $('recBtn').classList.add('on');
    $('recBtn').textContent = '⏹';
    $('recBadge').hidden = false;
  },

  // Called every frame once the round is over: film the freeze, then stop.
  tick(rdt) {
    if (!this.rec) return;
    this.tail -= rdt;
    if (this.tail <= 0) this.stop();
  },

  stop() {
    if (this.rec && this.rec.state !== 'inactive') this.rec.stop();
  },

  save() {
    const type = this.rec.mimeType || 'video/webm';
    const blob = new Blob(this.chunks, { type });
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const name = `brainrot-race-${stamp}.${ext}`;
    const secs = (performance.now() - this.startedAt) / 1000;
    const fps = (this.frames / secs).toFixed(1);

    this.rec = null;
    this.chunks = [];
    this.on = false;
    resize();                 // back to the normal screen layout
    $('recBtn').classList.remove('on');
    $('recBtn').textContent = '⏺';
    $('recBadge').hidden = true;

    if (UPLOAD_PATH) {
      fetch(`${UPLOAD_PATH}?name=${encodeURIComponent(name)}&fps=${fps}`, { method: 'POST', body: blob });
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  },

  // On-screen REC badge with elapsed time.
  frame() {
    if (!this.on) return;
    this.frames++;
    const s = Math.floor((performance.now() - this.startedAt) / 1000);
    const text = `● REC ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    const badge = $('recBadge');
    if (badge.textContent !== text) badge.textContent = text;
  },
};

/* =====================================================================
   UI
   ===================================================================== */

const $ = id => document.getElementById(id);

$('recBtn').addEventListener('click', () => (Recorder.on ? Recorder.stop() : Recorder.start()));

// Tap a marble during the race to make it use its special move
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (S.phase !== 'race' || S.timeUp) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * LW;
  const y = (e.clientY - rect.top) / rect.height * LH - L.trackTop;
  const b = racing().find(o => (o.x - x) ** 2 + (o.y - y) ** 2 < (R * 2.2) ** 2);
  if (b) useAbility(b);
});

// Audio starts on load if the browser allows it. If it's blocked, any touch,
// click or key press starts it (different browsers count different events).
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  window.addEventListener(ev, () => Sound.unlock(), { capture: true });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) Sound.unlock(); });

const muteBtn = $('muteBtn');
function toggleMute() {
  Sound.setMuted(!Sound.muted);
  muteBtn.textContent = Sound.muted ? '🔇' : '🔊';
}
muteBtn.addEventListener('click', toggleMute);

const panel = $('panel');
$('setBtn').addEventListener('click', () => { panel.hidden = !panel.hidden; });
$('closeBtn').addEventListener('click', () => { panel.hidden = true; });
$('resetBtn').addEventListener('click', () => { startRound(); panel.hidden = true; });

// Bind a slider to a Settings key with a formatted readout
function bindSlider(inputId, labelId, key, fmtVal) {
  const input = $(inputId), label = $(labelId);
  input.value = Settings[key];
  label.textContent = fmtVal(Settings[key]);
  input.addEventListener('input', () => {
    Settings[key] = parseFloat(input.value);
    label.textContent = fmtVal(Settings[key]);
  });
}
bindSlider('inGrav', 'vGrav', 'gravity', v => String(Math.round(v)));
bindSlider('inBounce', 'vBounce', 'bounce', v => v.toFixed(2));
bindSlider('inMoves', 'vMoves', 'moves', v => (v ? v.toFixed(1) + '×' : 'off'));

// Keyboard shortcuts for desktop recording: M = mute, R = restart the round
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === 'r' || e.key === 'R') startRound();
});

window.addEventListener('resize', resize);

/* =====================================================================
   MAIN LOOP
   ===================================================================== */

resize();
startRound();
Sound.unlock();     // try to start sound right away
if (params.has('autorecord')) Recorder.start();

let lastT = performance.now();
function frame(now) {
  // Never negative (the first rAF timestamp can be earlier than lastT), capped after tab switches
  const rdt = clamp((now - lastT) / 1000, 0, 1 / 20);
  lastT = now;
  try {
    update(rdt);
    draw();
  } catch (err) {
    console.error(err);     // log it (render.py prints these) but keep the loop alive
  }
  Recorder.frame();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
