function drawGym(gm) {
  const raid = S.raid && S.raid.gym === gm && S.raid.phase !== 'fled';
  const T = TEAMS[gm.team] || null;
  const col = T ? T.color : '#9AA4AC';
  const x = gm.x, y = gm.y;
  ell(ctx, x, y + 1, 16, 7); ctx.fillStyle = rgba(col, 0.55); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
  if (gm.pulse > 0) { ell(ctx, x, y + 1, 16 + 26 * (1 - gm.pulse), 7 + 11 * (1 - gm.pulse)); ctx.lineWidth = 3 * gm.pulse; ctx.strokeStyle = col; ctx.stroke(); }
  if (raid) return;                                         // the raid egg/boss sits on top instead
  ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(x - 5.5, y - 24); ctx.lineTo(x + 5.5, y - 24); ctx.lineTo(x + 8, y); ctx.closePath();
  const tg = ctx.createLinearGradient(x - 8, 0, x + 8, 0);
  tg.addColorStop(0, '#FFFFFF'); tg.addColorStop(1, '#C9D3DA');
  ctx.fillStyle = tg; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke();
  ctx.fillStyle = col; ctx.fillRect(x - 6.6, y - 14, 13.2, 4);
  ell(ctx, x, y - 26, 10, 5); ink(ctx, col, 1.5);
  const glow = 0.5 + 0.5 * Math.sin(S.time * 4 + x);
  circ(ctx, x, y - 30, 4 + glow); ctx.fillStyle = lighten(col, 0.5); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = INK; ctx.stroke();
}

function drawStop(st) {
  const bob = Math.sin(S.time * 2.5 + st.phase) * 1.5;
  ell(ctx, st.x, st.y + 1, 6, 2.5); ctx.fillStyle = 'rgba(20,50,80,0.3)'; ctx.fill();
  seg(ctx, st.x, st.y, st.x, st.y - 11, 1.8, '#3C5A7A');
  const cx = st.x, cy = st.y - 17 + bob, s = 6.2;
  const purple = st.spun > 0;
  const cols = purple ? ['#E2B5FF', '#B06BEA', '#8A3FCC'] : ['#9FE5FF', '#34AEEA', '#1A7FC0'];
  const face = (pts, col) => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); };
  face([[cx, cy - s], [cx + s, cy - s / 2], [cx, cy], [cx - s, cy - s / 2]], cols[0]);
  face([[cx - s, cy - s / 2], [cx, cy], [cx, cy + s], [cx - s, cy + s / 2]], cols[1]);
  face([[cx + s, cy - s / 2], [cx, cy], [cx, cy + s], [cx + s, cy + s / 2]], cols[2]);
  ctx.beginPath(); ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s, cy - s / 2); ctx.lineTo(cx + s, cy + s / 2); ctx.lineTo(cx, cy + s);
  ctx.lineTo(cx - s, cy + s / 2); ctx.lineTo(cx - s, cy - s / 2); ctx.closePath();
  ctx.lineWidth = 1.2; ctx.strokeStyle = INK; ctx.stroke();
}

function drawLure() {
  const Lr = S.lure;
  if (!Lr) return;
  const k = Math.min(1, Lr.t / 0.4) * Math.min(1, (Lr.dur - Lr.t) / 0.5);
  ctx.save();
  ctx.globalAlpha = 0.35 * k;
  const gl = ctx.createRadialGradient(Lr.x, Lr.y - 14, 0, Lr.x, Lr.y - 14, 60);
  gl.addColorStop(0, '#FF9AD2'); gl.addColorStop(1, 'rgba(255,154,210,0)');
  ctx.fillStyle = gl; circ(ctx, Lr.x, Lr.y - 14, 60); ctx.fill();
  ctx.globalAlpha = k;
  for (let i = 0; i < 10; i++) {                         // petals orbiting the PokéStop
    const a = S.time * 1.6 + i * TAU / 10, rr = 22 + 6 * Math.sin(S.time * 3 + i);
    ctx.save(); ctx.translate(Lr.x + Math.cos(a) * rr, Lr.y - 14 + Math.sin(a) * rr * 0.7); ctx.rotate(a * 2);
    ell(ctx, 0, 0, 4.5, 2.4); ctx.fillStyle = i % 2 ? '#FF8CC6' : '#FFC2E2'; ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawRaid() {
  const R = S.raid;
  if (!R) return;
  if (R.phase === 'egg') {
    const wob = Math.sin(R.t * 18) * 0.12 * (0.4 + R.t / TUNING.raidEgg);
    const pop = easeOutBack(clamp(R.t / 0.35, 0, 1));
    ctx.save();
    ctx.globalAlpha = 0.4;
    const gl = ctx.createRadialGradient(R.x, R.y - 6, 0, R.x, R.y - 6, 50);
    gl.addColorStop(0, '#FF9AD2'); gl.addColorStop(1, 'rgba(255,154,210,0)');
    ctx.fillStyle = gl; circ(ctx, R.x, R.y - 6, 50); ctx.fill();
    ctx.restore();
    drawRaidEgg(ctx, R.x, R.y - 6, pop, wob);
    const left = Math.max(1, Math.ceil(TUNING.raidEgg - R.t));
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 18px ${GO}`;
    goText(ctx, String(left), R.x, R.y - 40, '#FFFFFF', '#C2307E', 5, 0);
    ctx.restore();
    return;
  }
  const k = R.phase === 'boss' ? easeOutBack(clamp(R.t / 0.4, 0, 1)) : clamp(1 - R.t / 0.5, 0, 1);
  if (k <= 0) return;
  const sh = R.shake > 0 ? rand(-2, 2) : 0;
  const sp = getSprite('snorlax', R.r);
  ctx.save();
  ctx.translate(R.x + sh, R.y);
  ctx.globalAlpha = 0.4;
  circ(ctx, 0, 0, R.r + 10); ctx.fillStyle = '#F06BC8'; ctx.fill();
  ctx.globalAlpha = 1;
  ctx.scale(k, k);
  ctx.drawImage(sp.canvas, -sp.size / 2, -sp.size / 2, sp.size, sp.size);
  ctx.restore();
  if (R.phase !== 'boss') return;
  // HP bar, colored by who's dealt the damage
  const w = 58, x0 = R.x - w / 2, y0 = R.y - R.r - 18;
  roundRect(ctx, x0 - 2, y0 - 2, w + 4, 10, 5); ctx.fillStyle = INK; ctx.fill();
  roundRect(ctx, x0, y0, w, 6, 3); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  let x = x0 + w * Math.max(0, R.hp) / TUNING.raidHP;
  ctx.fillStyle = '#5FD68A'; ctx.fillRect(x0, y0, x - x0, 6);
  for (let t = 0; t < 3; t++) {
    const dw = w * R.dmg[t] / TUNING.raidHP;
    ctx.fillStyle = TEAMS[t].color; ctx.fillRect(x, y0, Math.min(dw, x0 + w - x), 6); x += dw;
  }
  const timeLeft = 1 - R.t / TUNING.raidDur;                 // little timer ring
  ctx.beginPath(); ctx.arc(R.x + w / 2 + 10, y0 + 3, 6, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0, timeLeft));
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#F06BC8'; ctx.stroke();
}

function drawBall(b) {
  const T = TEAMS[b.team];
  let k = b.age < 0.35 ? easeOutBack(b.age / 0.35) : 1;
  if (b.stolen) k *= 1 - 0.6 * clamp(b.stolen.t, 0, 1);
  if (k <= 0) return;
  const r = b.r * k;
  if (!b.stolen) { ell(ctx, b.x + 2, b.y + 3.5, r + 1, (r + 1) * 0.8); ctx.fillStyle = 'rgba(15,35,25,0.28)'; ctx.fill(); }
  if (S.weather && S.weather.team === b.team) {             // boosted: glowing aura
    circ(ctx, b.x, b.y, r + 5 + Math.sin(S.time * 12 + b.x) * 1.5);
    ctx.fillStyle = rgba(T.light, 0.55); ctx.fill();
  }
  circ(ctx, b.x, b.y, r + 2.8); ctx.fillStyle = INK; ctx.fill();
  circ(ctx, b.x, b.y, r + 1.8); ctx.fillStyle = T.color; ctx.fill();
  const sp = getSprite(b.id, b.r);
  ctx.drawImage(sp.canvas, b.x - sp.size / 2 * k, b.y - sp.size / 2 * k, sp.size * k, sp.size * k);
  if (b.stolen) {                                          // Team Rocket's net
    ctx.save(); ctx.globalAlpha = 0.8; ctx.strokeStyle = '#2A2A35'; ctx.lineWidth = 1;
    circ(ctx, b.x, b.y, r + 3); ctx.stroke();
    for (let a = 0; a < 4; a++) { const an = a * Math.PI / 4; seg(ctx, b.x - Math.cos(an) * (r + 3), b.y - Math.sin(an) * (r + 3), b.x + Math.cos(an) * (r + 3), b.y + Math.sin(an) * (r + 3), 1, '#2A2A35'); }
    ctx.restore();
  }
}

function drawWeather() {
  const W = S.weather;
  if (!W) return;
  const k = Math.min(1, W.t / 0.5) * Math.min(1, (W.dur - W.t) / 0.6);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, MW, MH); ctx.clip();
  if (W.kind === 'rain') {
    ctx.fillStyle = `rgba(40,90,170,${0.12 * k})`; ctx.fillRect(0, 0, MW, MH);
    ctx.strokeStyle = `rgba(220,240,255,${0.55 * k})`; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < 70; i++) {
      const x = ((i * 97.3 + S.time * 160) % (MW + 60)) - 30, y = ((i * 53.7 + S.time * 620) % (MH + 40)) - 20;
      ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 13);
    }
    ctx.stroke();
  } else if (W.kind === 'sun') {
    const gl = ctx.createRadialGradient(MW, 0, 10, MW, 0, 420);
    gl.addColorStop(0, `rgba(255,236,150,${0.5 * k})`); gl.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, MW, MH);
    ctx.fillStyle = `rgba(255,240,180,${0.13 * k})`;
    for (let i = 0; i < 5; i++) {
      const a = 1.75 + i * 0.22 + Math.sin(S.time * 0.8 + i) * 0.04;
      ctx.beginPath(); ctx.moveTo(MW, 0); ctx.lineTo(MW + Math.cos(a) * 800, Math.sin(a) * 800); ctx.lineTo(MW + Math.cos(a + 0.07) * 800, Math.sin(a + 0.07) * 800); ctx.closePath(); ctx.fill();
    }
  } else {
    ctx.fillStyle = `rgba(30,25,60,${0.22 * k})`; ctx.fillRect(0, 0, MW, MH);
  }
  ctx.restore();
  if (S.bolt) {                                              // lightning strike
    const b = S.bolt, rnd = seeded(Math.floor(b.seed) + 1);
    ctx.save(); ctx.globalAlpha = clamp(b.life / 0.3, 0, 1);
    ctx.beginPath(); ctx.moveTo(b.x + (rnd() - 0.5) * 60, -10);
    for (let k2 = 1; k2 <= 8; k2++) ctx.lineTo(b.x + (rnd() - 0.5) * 40 * (1 - k2 / 9), lerp(-10, b.y, k2 / 8));
    ctx.lineJoin = 'round';
    ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(255,230,90,0.6)'; ctx.stroke();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
    ctx.restore();
  }
}

function drawFx() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of S.fx) {
    const t = 1 - f.life / f.max;      // 0 → 1 over the effect's life
    if (f.kind === 'ring') {
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.width * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0, f.r0 + (f.r1 - f.r0) * easeOut(t)), 0, TAU); ctx.stroke();
    } else if (f.kind === 'spark') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = f.color;
      circ(ctx, f.x, f.y, f.size * (1 - t * 0.5)); ctx.fill();
    } else if (f.kind === 'zap') {
      ctx.globalAlpha = 1 - t;
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ang);
      ctx.beginPath(); ctx.moveTo(-5, -3); ctx.lineTo(0, 1); ctx.lineTo(-1, -1); ctx.lineTo(5, 3);
      ctx.lineWidth = 2; ctx.strokeStyle = f.color; ctx.stroke();
      ctx.restore();
    } else if (f.kind === 'confetti') {
      ctx.globalAlpha = t < 0.85 ? 1 : (1 - t) / 0.15;
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
      ctx.fillStyle = f.color; ctx.fillRect(-f.size / 2, -f.size / 4, f.size, f.size / 2);
      ctx.restore();
    } else if (f.kind === 'egg') {                           // a wild Pokémon is about to pop out
      ctx.globalAlpha = 1;
      const wob = Math.sin(S.time * 20) * 0.2, pop = easeOutBack(clamp(t * 4, 0, 1));
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(wob); ctx.scale(pop, pop);
      circ(ctx, 0, 0, 13); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
      drawPokeball(ctx, 0, 0, 8);
      ctx.restore();
    }
  }
  for (const f of S.fx) {
    if (f.kind !== 'float') continue;
    const t = 1 - f.life / f.max;
    const pop = t < 0.12 ? 0.5 + 0.5 * easeOutBack(t / 0.12) : 1;
    ctx.globalAlpha = t < 0.75 ? 1 : (1 - t) / 0.25;
    const y = f.y - 26 * easeOut(t), x = clamp(f.x, 100, MW - 100);
    fitFont(ctx, f.text, 300, f.size * pop, 900);
    goText(ctx, f.text, x, y, '#FFFFFF', f.color, 5, 2);
  }
  ctx.restore();
}

// Percentages as text: one decimal place when two teams would otherwise show
// the same whole number (so the winner is never "36% vs 36%").
function pctTexts(shares) {
  const whole = shares.map(v => Math.round(v * 100));
  const tie = whole.some((w, i) => whole.indexOf(w) !== i);
  return shares.map(v => (tie ? (v * 100).toFixed(1) : String(Math.round(v * 100))) + '%');
}

// The team score bar: three colored segments sized by how much each team owns.
function drawScoreBar() {
  const x0 = 18, x1 = 522, y = L.stripY, h = 32, W = x1 - x0;
  ctx.save();
  roundRect(ctx, x0 - 3, y - h / 2 - 3 + 3, W + 6, h + 6, (h + 6) / 2); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
  roundRect(ctx, x0 - 3, y - h / 2 - 3, W + 6, h + 6, (h + 6) / 2); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.save();
  roundRect(ctx, x0, y - h / 2, W, h, h / 2); ctx.clip();
  const tot = S.shown[0] + S.shown[1] + S.shown[2] || 1;
  let x = x0;
  const segs = [];
  for (let t = 0; t < 3; t++) {
    const w = W * S.shown[t] / tot;
    const gr = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
    gr.addColorStop(0, lighten(TEAMS[t].color, 0.25)); gr.addColorStop(1, TEAMS[t].color);
    ctx.fillStyle = gr; ctx.fillRect(x, y - h / 2, w + 0.5, h);
    segs.push([x, w]);
    x += w;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x0, y - h / 2, W, h * 0.35);
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lead = S.timeUp ? S.winner : leader();
  const pcts = S.timeUp ? pctTexts(S.banner.shares) : [0, 1, 2].map(t => Math.round(share(t) * 100) + '%');
  for (let t = 0; t < 3; t++) {
    const [sx, w] = segs[t], pct = pcts[t];
    let label = `${TEAMS[t].name} ${pct}`;
    ctx.font = `900 16px ${GO}`;
    if (ctx.measureText(label).width > w - 38) label = pct;
    const cx = sx + w / 2 + (w > 60 ? 9 : 0);
    fitFont(ctx, label, Math.max(20, w - 34), 17, 900);
    const ex = cx - ctx.measureText(label).width / 2 - 13;
    if (w > 60) drawEmblem(ctx, t, ex, y, 9.5);
    goText(ctx, label, cx, y + 1, '#FFFFFF', TEAMS[t].dark, 4, 0);
    if (t === lead) drawCrown(w > 60 ? ex : sx + w / 2, y - 15, 0.75);   // crown on the leader
  }
  ctx.restore();
}

function drawCrown(x, y, k) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(k, k);
  ctx.beginPath();
  ctx.moveTo(-9, 4); ctx.lineTo(-9, -4); ctx.lineTo(-4.5, 0); ctx.lineTo(0, -6); ctx.lineTo(4.5, 0); ctx.lineTo(9, -4); ctx.lineTo(9, 4);
  ctx.closePath();
  ctx.fillStyle = '#FFD23F'; ctx.fill();
  ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
}

// Round countdown (left pill) and the weather (right pill), Pokémon GO style.
function drawHud() {
  const secs = Math.max(0, Math.ceil(S.clock));
  const text = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  const urgent = !S.timeUp && S.clock <= 10;
  const pulse = urgent ? 1 + 0.12 * Math.pow(S.clock - Math.floor(S.clock), 3) : 1;
  const pill = (x, w, color) => {
    roundRect(ctx, x - w / 2, L.hudY - 18 + 3, w, 36, 18); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
    roundRect(ctx, x - w / 2, L.hudY - 18, w, 36, 18); ctx.fillStyle = color; ctx.fill();
  };
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(64, L.hudY); ctx.scale(pulse, pulse); ctx.translate(-64, -L.hudY);
  pill(64, 100, urgent || S.timeUp ? '#E63946' : '#FFFFFF');
  circ(ctx, 34, L.hudY, 9); ctx.lineWidth = 2.4; ctx.strokeStyle = urgent || S.timeUp ? '#FFFFFF' : '#39C4B6'; ctx.stroke();
  seg(ctx, 34, L.hudY, 34, L.hudY - 5, 2, ctx.strokeStyle); seg(ctx, 34, L.hudY, 38, L.hudY + 1, 2, ctx.strokeStyle);
  ctx.font = `900 22px ${GO}`;
  ctx.fillStyle = urgent || S.timeUp ? '#FFFFFF' : UI_TEXT;
  ctx.fillText(text, 74, L.hudY + 1);
  ctx.restore();
  const kind = S.weather ? S.weather.kind : 'clear';
  pill(474, 104, '#FFFFFF');
  drawWeatherIcon(ctx, kind, 444, L.hudY - 1, 0.95);
  ctx.font = `900 14px ${GO}`;
  ctx.fillStyle = S.weather ? TEAMS[S.weather.team].dark : UI_TEXT;
  ctx.fillText(WEATHERS[kind].label, 490, L.hudY + 1);
  ctx.restore();
}

// In-game style notification card that drops in at the top of the map.
function drawNote() {
  const N = S.note;
  if (!N) return;
  const age = N.max - N.life;
  const inT = clamp(age / 0.25, 0, 1), outT = clamp(N.life / 0.3, 0, 1);
  const w = 420, h = 58, x = L.mapCX, y = L.mapY + 38 - 24 * (1 - easeOutBack(inT));
  ctx.save();
  ctx.globalAlpha = Math.min(inT * 1.5, outT);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = blur(10); ctx.shadowOffsetY = 3 * scale;
  roundRect(ctx, x - w / 2, y - h / 2, w, h, 22); ctx.fillStyle = 'rgba(255,255,255,0.97)'; ctx.fill();
  ctx.restore();
  roundRect(ctx, x - w / 2, y - h / 2, 8, h, 4); ctx.fillStyle = N.color; ctx.fill();
  const ix = x - w / 2 + 40;
  circ(ctx, ix, y, 23); ctx.fillStyle = rgba(N.color, 0.16); ctx.fill();
  ctx.save(); ctx.translate(ix, y); N.icon(ctx); ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  fitFont(ctx, N.title, w - 90, 23, 900);
  ctx.fillStyle = UI_TEXT; ctx.fillText(N.title, ix + 34, y - 9);
  fitFont(ctx, N.sub, w - 90, 15, 700);
  ctx.fillStyle = '#6E8A94'; ctx.fillText(N.sub, ix + 34, y + 14);
  ctx.restore();
}

// The winner card at 0:00.
function drawBanner() {
  const B = S.banner;
  if (!B) return;
  const T = TEAMS[B.team];
  const pop = 0.3 + 0.7 * easeOutBack(clamp(B.age / 0.3, 0, 1));
  const w = 420, h = 214, x = L.mapCX, y = L.mapY + MH * 0.47;
  ctx.save();
  ctx.translate(x, y); ctx.scale(pop, pop);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = blur(18); ctx.shadowOffsetY = 5 * scale;
  roundRect(ctx, -w / 2, -h / 2, w, h, 30); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.restore();
  ctx.save();
  roundRect(ctx, -w / 2, -h / 2, w, h, 30); ctx.clip();
  const hg = ctx.createLinearGradient(0, -h / 2, 0, -h / 2 + 96);
  hg.addColorStop(0, lighten(T.color, 0.2)); hg.addColorStop(1, T.color);
  ctx.fillStyle = hg; ctx.fillRect(-w / 2, -h / 2, w, 96);
  ctx.restore();
  // rays behind the emblem
  ctx.save();
  ctx.translate(0, -h / 2 + 4); ctx.rotate(S.time * 0.4);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-10, -90); ctx.lineTo(10, -90); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  drawEmblem(ctx, B.team, 0, -h / 2 + 4, 34);
  drawCrown(0, -h / 2 - 38, 2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fitFont(ctx, `TEAM ${T.name}`, w - 40, 40, 900);
  goText(ctx, `TEAM ${T.name}`, 0, -h / 2 + 64, '#FFFFFF', T.dark, 8, 3);
  fitFont(ctx, 'TAKES OVER THE MAP!', w - 50, 24, 900);
  ctx.fillStyle = UI_TEXT; ctx.fillText('TAKES OVER THE MAP!', 0, -h / 2 + 118);
  // final percentages
  const order = [0, 1, 2].sort((a, b) => B.shares[b] - B.shares[a]);
  const pcts = pctTexts(B.shares);
  order.forEach((t, i) => {
    const bx = -w / 2 + 40 + i * ((w - 80) / 3) + (w - 80) / 6, by = h / 2 - 44;
    drawEmblem(ctx, t, bx - 34, by, 14);
    ctx.font = `900 ${i === 0 ? 30 : 24}px ${GO}`;
    ctx.fillStyle = TEAMS[t].color;
    ctx.textAlign = 'left';
    if (pcts[t].includes('.')) fitFont(ctx, pcts[t], 70, i === 0 ? 25 : 20, 900);
    ctx.lineWidth = 3; ctx.strokeStyle = TEAMS[t].dark; ctx.strokeText(pcts[t], bx - 16, by + 1);
    ctx.fillText(pcts[t], bx - 16, by + 1);
  });
  ctx.restore();
}

function draw() {
  if (!canvas.width || !canvas.height || !backdrop.width) return;   // page not laid out yet
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(backdrop, 0, 0);
  const sx = S.shake ? rand(-1, 1) * S.shake : 0, sy = S.shake ? rand(-1, 1) * S.shake : 0;

  // The map (clipped to its frame), in map units
  ctx.setTransform(scale, 0, 0, scale, (MAP_X + sx) * scale, (L.mapY + sy) * scale);
  ctx.save();
  roundRect(ctx, 0, 0, MW, MH, 6); ctx.clip();
  drawTerritory();
  drawWeather();
  drawLure();
  for (const gm of S.gyms) drawGym(gm);
  for (const st of S.stops) drawStop(st);
  drawRaid();
  for (const b of S.balls) if (!b.stolen) drawBall(b);
  ctx.restore();

  // Things in the air may cross the frame (but not the hook)
  ctx.save();
  ctx.beginPath(); ctx.rect(-MAP_X, L.stripY + 20 - L.mapY, LW, L.panelBottom - L.stripY - 20); ctx.clip();
  for (const b of S.balls) if (b.stolen) drawBall(b);
  for (const bm of S.bombs) {                              // falling Rocket bombs
    const p = clamp(bm.t / bm.dur, 0, 1), sz = lerp(1.7, 1, p);
    ell(ctx, bm.x, bm.y, 6 * p + 2, 3 * p + 1); ctx.fillStyle = 'rgba(15,20,25,0.35)'; ctx.fill();
    ctx.save(); ctx.translate(bm.x, bm.y - 40 * (1 - p)); ctx.scale(sz, sz);
    circ(ctx, 0, 0, 6); ink(ctx, '#2A2A35', 1.4);
    drawRocketR(ctx, 0, 0.5, 0.28);
    ctx.restore();
  }
  if (S.rocket) drawRocket(S.rocket);
  for (const B of S.birds) drawBird(B);
  drawFx();
  ctx.restore();

  // HUD, score bar, notifications (unshaken)
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawScoreBar();
  drawHud();
  drawNote();
  if (S.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${S.flash})`;
    ctx.fillRect(-20, -20, LW + 40, LH + 40);
  }
  drawBanner();

  // Black bands (drawn last, unshaken, so nothing spills into TikTok's UI zones)
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, LW, L.panelTop);
  ctx.fillRect(0, L.panelBottom, LW, LH - L.panelBottom);
}

/* =====================================================================
   VIDEO RECORDING
   Records one full round straight from the canvas (1080×1920, 60fps, with
   sound), keeps going a few seconds into the freeze, then saves the file.
   ===================================================================== */

const params = new URLSearchParams(location.search);
// ?upload=/path  → POST the finished video to this same-origin path instead of
// downloading it (used by tools/render.py). ?autorecord → start on load.
const UPLOAD_PATH = /^\/(?!\/)/.test(params.get('upload') || '') ? params.get('upload') : null;

const Recorder = {
  on: false, rec: null, chunks: [], tail: 0, startedAt: 0, frames: 0,
  TAIL_SECONDS: 3.5,        // how long to keep filming the frozen end screen

  // Best format this browser can record: MP4 (H.264/AAC) first, WebM fallback.
  pickMime() {
    const types = [
      'video/mp4;codecs=avc1.64002A,mp4a.40.2',
      'video/mp4;codecs=avc1,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm',
    ];
    return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  },

  start() {
    if (this.on) return;
    if (!window.MediaRecorder || !canvas.captureStream) {
      alert("This browser can't record video. Try Chrome or Safari on a computer.");
      return;
    }
    Sound.unlock();
    this.on = true;
    resize();                 // lock the canvas to 1080×1920
    startRound();
    draw();

    const stream = canvas.captureStream(60);
    const audio = Sound.recordStream();
    if (audio) audio.getAudioTracks().forEach(t => stream.addTrack(t));

    const mimeType = this.pickMime();
    const opts = { videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 192_000 };
    if (mimeType) opts.mimeType = mimeType;
    this.rec = new MediaRecorder(stream, opts);
    this.chunks = [];
    this.rec.ondataavailable = e => { if (e.data.size) this.chunks.push(e.data); };
    this.rec.onstop = () => this.save();
    this.rec.start(1000);

    this.tail = this.TAIL_SECONDS;
    this.startedAt = performance.now();
    this.frames = 0;
    $('recBtn').classList.add('on');
    $('recBtn').textContent = '⏹';
    $('recBadge').hidden = false;
  },

  // Called every frame once the round is over: film the freeze, then stop.
  tick(rdt) {
    if (!this.rec) return;
    this.tail -= rdt;
    if (this.tail <= 0) this.stop();
  },

  stop() {
    if (this.rec && this.rec.state !== 'inactive') this.rec.stop();
  },

  save() {
    const type = this.rec.mimeType || 'video/webm';
    const blob = new Blob(this.chunks, { type });
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const name = `pokemon-go-team-war-${stamp}.${ext}`;
    const secs = (performance.now() - this.startedAt) / 1000;
    const fps = (this.frames / secs).toFixed(1);

    this.rec = null;
    this.chunks = [];
    this.on = false;
    resize();                 // back to the normal screen layout
    $('recBtn').classList.remove('on');
    $('recBtn').textContent = '⏺';
    $('recBadge').hidden = true;

    if (UPLOAD_PATH) {
      fetch(`${UPLOAD_PATH}?name=${encodeURIComponent(name)}&fps=${fps}`, { method: 'POST', body: blob });
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  },

  // On-screen REC badge with elapsed time.
  frame() {
    if (!this.on) return;
    this.frames++;
    const s = Math.floor((performance.now() - this.startedAt) / 1000);
    const text = `● REC ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    const badge = $('recBadge');
    if (badge.textContent !== text) badge.textContent = text;
  },
};

/* =====================================================================
   UI
   ===================================================================== */

const $ = id => document.getElementById(id);

$('recBtn').addEventListener('click', () => (Recorder.on ? Recorder.stop() : Recorder.start()));

// Tap the map: a wild Pokémon appears there and joins whoever owns that spot
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (S.timeUp) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * LW - MAP_X;
  const y = (e.clientY - rect.top) / rect.height * LH - L.mapY;
  if (x < 0 || y < 0 || x > MW || y > MH) return;
  const t = grid[cellAt(x, y)];
  if (t !== NEUTRAL) addBall(t, x, y);
});

// Audio starts on load if the browser allows it. If it's blocked, any touch,
// click or key press starts it (different browsers count different events).
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  window.addEventListener(ev, () => Sound.unlock(), { capture: true });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) Sound.unlock(); });

const muteBtn = $('muteBtn');
function toggleMute() {
  Sound.setMuted(!Sound.muted);
  muteBtn.textContent = Sound.muted ? '🔇' : '🔊';
}
muteBtn.addEventListener('click', toggleMute);

const panel = $('panel');
$('setBtn').addEventListener('click', () => { panel.hidden = !panel.hidden; });
$('closeBtn').addEventListener('click', () => { panel.hidden = true; });
$('resetBtn').addEventListener('click', () => { startRound(); panel.hidden = true; });

// Bind a slider to a Settings key with a formatted readout
function bindSlider(inputId, labelId, key, fmtVal) {
  const input = $(inputId), label = $(labelId);
  input.value = Settings[key];
  label.textContent = fmtVal(Settings[key]);
  input.addEventListener('input', () => {
    Settings[key] = parseFloat(input.value);
    label.textContent = fmtVal(Settings[key]);
  });
}
bindSlider('inSpeed', 'vSpeed', 'speed', v => v.toFixed(2) + '×');
bindSlider('inStart', 'vStart', 'start', v => String(v));

// Keyboard shortcuts for desktop recording: M = mute, R = restart the round
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === 'r' || e.key === 'R') startRound();
});

window.addEventListener('resize', resize);

/* =====================================================================
   MAIN LOOP
   ===================================================================== */

resize();
startRound();
Sound.unlock();     // try to start sound right away
if (params.has('autorecord')) Recorder.start();

let lastT = performance.now();
function frame(now) {
  // Never negative (the first rAF timestamp can be earlier than lastT), capped after tab switches
  const rdt = clamp((now - lastT) / 1000, 0, 1 / 20);
  lastT = now;
  try {
    update(rdt);
    draw();
  } catch (err) {
    console.error(err);     // log it (render.py prints these) but keep the loop alive
  }
  Recorder.frame();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
