  for (const s of [-1, 1]) seg(ctx, s * 18, 18, s * 9, 36, 1.4, '#3A2A20');
  roundRect(ctx, -12, 34, 24, 14, 3); ctx.fillStyle = '#7A5230'; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = INK; ctx.stroke();
  ctx.font = `900 11px ${GO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#E23B3B'; ctx.fillText('R', 0, 42);
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * 12, -24); ctx.lineTo(s * 30, -36); ctx.lineTo(s * 28, -10); ctx.closePath(); ink(ctx, '#F3E3B5', 1.8);
    ctx.beginPath(); ctx.moveTo(s * 16, -22); ctx.lineTo(s * 27, -30); ctx.lineTo(s * 26, -14); ctx.closePath(); ctx.fillStyle = '#5A3A2A'; ctx.fill();
  }
  const gr = ctx.createRadialGradient(-10, -12, 4, 0, 0, 32);
  gr.addColorStop(0, '#FFF6DA'); gr.addColorStop(1, '#D9B97A');
  circ(ctx, 0, 0, 30); ctx.fillStyle = gr; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
  ell(ctx, 0, -17, 7, 6.5); ink(ctx, '#F5C542', 1.6);
  for (const s of [-1, 1]) {
    ell(ctx, s * 11, -2, 5.5, 7); ink(ctx, '#FFFFFF', 1.4);
    ell(ctx, s * 11, -1, 1.6, 5); ctx.fillStyle = '#111111'; ctx.fill();
    for (const dy of [-3, 1, 5]) seg(ctx, s * 16, 8 + dy * 0.4, s * 34, 4 + dy * 1.4, 1, INK);
  }
  ctx.beginPath(); ctx.moveTo(-9, 12); ctx.quadraticCurveTo(0, 20, 9, 12); ctx.lineWidth = 1.6; ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
}

// Master Ball lock-on reticle.
function drawLockOn() {
  const M = S.master;
  if (!M || M.launched || M.target.state !== 'free') return;
  const m = M.target, y = sy(m.y), k = clamp(M.t / 0.6, 0, 1), R = m.r + 30 - 14 * k;
  ctx.save();
  ctx.translate(m.x, y); ctx.rotate(S.time * 2);
  ctx.strokeStyle = '#F06BC8'; ctx.lineWidth = 2.5;
  circ(ctx, 0, 0, R); ctx.stroke();
  for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); seg(ctx, R - 6, 0, R + 8, 0, 2.5, '#F06BC8'); }
  ctx.restore();
}

function drawFx() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of S.fx) {
    const t = 1 - f.life / f.max;
    if (f.kind === 'ring') {
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.width * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(f.x, sy(f.y), Math.max(0, f.r0 + (f.r1 - f.r0) * easeOut(t)), 0, TAU); ctx.stroke();
    } else if (f.kind === 'spark') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = f.color;
      circ(ctx, f.x, sy(f.y), f.size * (1 - t * 0.5)); ctx.fill();
    } else if (f.kind === 'star') {
      ctx.globalAlpha = 1 - t * t;
      ctx.save(); ctx.translate(f.x, sy(f.y)); ctx.rotate(t * 6);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? 2.6 : 6.5; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fillStyle = '#FFE57A'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = INK; ctx.stroke();
      ctx.restore();
    } else if (f.kind === 'confetti') {
      ctx.globalAlpha = t < 0.85 ? 1 : (1 - t) / 0.15;
      ctx.save(); ctx.translate(f.x, sy(f.y)); ctx.rotate(f.a);
      ctx.fillStyle = f.color; ctx.fillRect(-f.size / 2, -f.size / 4, f.size, f.size / 2);
      ctx.restore();
    } else if (f.kind === 'leaf') {
      ctx.globalAlpha = t < 0.8 ? 1 : (1 - t) / 0.2;
      ctx.save(); ctx.translate(f.x, sy(f.y)); ctx.rotate(f.a);
      ell(ctx, 0, 0, 5, 2.4); ctx.fillStyle = f.color; ctx.fill();
      ctx.restore();
    } else if (f.kind === 'vine' || f.kind === 'water' || f.kind === 'ember') {
      ctx.globalAlpha = 1 - t;
      const x1 = f.x1, y1 = sy(f.y1), x2 = f.x2, y2 = sy(f.y2);
      ctx.lineCap = 'round';
      if (f.kind === 'vine') {
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1 + x2) / 2 + 20, Math.min(y1, y2) - 30, x2, y2);
        ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#4FAE5A'; ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.lineWidth = 9; ctx.strokeStyle = f.kind === 'water' ? 'rgba(120,200,255,0.6)' : 'rgba(255,120,40,0.6)'; ctx.stroke();
        ctx.lineWidth = 4; ctx.strokeStyle = f.kind === 'water' ? '#E8F6FF' : '#FFE07A'; ctx.stroke();
      }
    }
  }
  for (const f of S.fx) {
    if (f.kind !== 'float') continue;
    const t = 1 - f.life / f.max;
    const pop = t < 0.12 ? 0.5 + 0.5 * easeOutBack(t / 0.12) : 1;
    ctx.globalAlpha = t < 0.75 ? 1 : (1 - t) / 0.25;
    const y = sy(f.y) - 26 * easeOut(t), x = clamp(f.x, 90, LW - 90);
    fitFont(ctx, f.text, 300, f.size * pop, 900, 'italic');
    catchText(ctx, f.text, x, y, f.color, 5);
  }
  ctx.restore();
}

// The 12 Pokémon along the top: free, being caught, or caught (in a Poké Ball).
function drawStrip() {
  const n = S.mons.length, gap = (LW - 52) / (n - 1), r = 14;
  roundRect(ctx, 10, L.stripY - 21, LW - 20, 42, 21); ctx.fillStyle = 'rgba(20,10,30,0.45)'; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.stroke();
  for (const m of S.mons) {
    const x = 26 + m.idx * gap, y = L.stripY;
    const caught = m.state === 'caught' && m.caughtT > 0.5;
    const sp = getSprite(m.def.id, r, caught);
    const bob = m === S.winner ? Math.sin(S.time * 6) * 2 : 0;
    ctx.drawImage(sp.canvas, x - sp.size / 2, y - sp.size / 2 + bob, sp.size, sp.size);
    if (caught) {
      const bs = getBallSprite('poke', 6);
      ctx.drawImage(bs.canvas, x + 4, y + 2, bs.size, bs.size);
    } else if (m.state === 'absorb' || m.state === 'inball') {
      circ(ctx, x, y, r + 3); ctx.lineWidth = 2.5; ctx.strokeStyle = `rgba(255,80,80,${0.6 + 0.4 * Math.sin(S.time * 12)})`; ctx.stroke();
    } else if (m === S.winner) {
      drawCrown(x, y - r - 7);
    }
  }
}

function drawCrown(x, y, k = 1) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(k, k);
  ctx.beginPath();
  ctx.moveTo(-9, 4); ctx.lineTo(-9, -4); ctx.lineTo(-4.5, 0); ctx.lineTo(0, -6); ctx.lineTo(4.5, 0); ctx.lineTo(9, -4); ctx.lineTo(9, 4);
  ctx.closePath();
  ctx.fillStyle = '#FFD23F'; ctx.fill();
  ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
}

// Timer (left) and Pokémon still free (right): translucent camera-UI pills.
function drawHud() {
  const secs = Math.max(0, Math.ceil(S.clock));
  const text = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  const urgent = !S.timeUp && S.clock <= 10;
  const pulse = urgent ? 1 + 0.12 * Math.pow(S.clock - Math.floor(S.clock), 3) : 1;
  const pill = (x, w, color) => {
    roundRect(ctx, x - w / 2, L.hudY - 18, w, 36, 18); ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();
  };
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(64, L.hudY); ctx.scale(pulse, pulse); ctx.translate(-64, -L.hudY);
  pill(64, 100, urgent || S.timeUp ? 'rgba(230,57,70,0.9)' : 'rgba(20,10,30,0.55)');
  ctx.font = `italic 900 23px ${GO}`; ctx.fillStyle = '#FFFFFF';
  ctx.fillText(text, 64, L.hudY + 1);
  ctx.restore();
  const left = freeMons().length;
  pill(474, 104, 'rgba(20,10,30,0.55)');
  const bs = getBallSprite('poke', 8);
  ctx.drawImage(bs.canvas, 440 - bs.size / 2, L.hudY - bs.size / 2, bs.size, bs.size);
  ctx.font = `italic 900 15px ${GO}`; ctx.fillStyle = '#FFFFFF';
  ctx.fillText(`${left} LEFT`, 488, L.hudY + 1);
  ctx.restore();
}

// Big italic catch-screen banners.
function drawBanner() {
  const B = S.banner;
  if (!B) return;
  if (B.kind === 'final' || B.kind === 'win') { drawWinner(B); return; }
  const age = B.max - B.life;
  const inT = clamp(age / 0.22, 0, 1), outT = clamp(B.life / 0.3, 0, 1);
  const y = B.kind === 'caught' ? sy(110) : sy(170);
  ctx.save();
  ctx.globalAlpha = outT;
  ctx.translate(L.acx + (1 - easeOut(inT)) * -300, y);
  ctx.transform(1, 0, -0.12, 1, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (B.kind === 'caught') {
    roundRect(ctx, -200, -22, 400, 44, 22); ctx.fillStyle = 'rgba(20,10,30,0.6)'; ctx.fill();
    const sp = getSprite(B.face.id, 16);
    ctx.drawImage(sp.canvas, -186 - sp.size / 2 + 16, -sp.size / 2, sp.size, sp.size);
    fitFont(ctx, B.text, 320, 22, 900, 'italic');
    catchText(ctx, B.text, 16, 1, '#FFD23F', 5);
  } else {
    roundRect(ctx, -230, -46, 460, 92, 18);
    const gr = ctx.createLinearGradient(-230, 0, 230, 0);
    gr.addColorStop(0, rgba(B.color, 0)); gr.addColorStop(0.2, rgba(B.color, 0.55)); gr.addColorStop(0.8, rgba(B.color, 0.55)); gr.addColorStop(1, rgba(B.color, 0));
    ctx.fillStyle = gr; ctx.fill();
    fitFont(ctx, B.text, 440, 44, 900, 'italic');
    const tg = ctx.createLinearGradient(0, -36, 0, 4);
    tg.addColorStop(0, '#FFFFFF'); tg.addColorStop(1, lighten(B.color, 0.55));
    catchText(ctx, B.text, 0, -12, tg, 7);
    fitFont(ctx, B.sub, 420, 17, 800, 'italic');
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,30,0.7)'; ctx.strokeText(B.sub, 0, 26);
    ctx.fillStyle = '#FFFFFF'; ctx.fillText(B.sub, 0, 26);
  }
  ctx.restore();
}

// The winner (or the escapees at 0:00), big, in a golden spotlight.
function drawWinner(B) {
  const final = B.kind === 'final';
  const faces = final ? B.faces : [B.face];
  const age = final ? (B.age += 0) || 0 : 0;
  const y = sy(165);
  ctx.save();
  const gl = ctx.createRadialGradient(L.acx, y, 0, L.acx, y, 190);
  gl.addColorStop(0, 'rgba(255,230,150,0.55)'); gl.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = gl; circ(ctx, L.acx, y, 190); ctx.fill();
  ctx.translate(L.acx, y);
  ctx.save(); ctx.rotate(S.time * 0.4);
  ctx.fillStyle = 'rgba(255,240,190,0.16)';
  for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-16, -170); ctx.lineTo(16, -170); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  const r = faces.length > 1 ? 30 : 46;
  faces.forEach((def, i) => {
    const x = (i - (faces.length - 1) / 2) * r * 2.4;
    const sp = getSprite(def.id, r);
    ctx.save(); ctx.translate(x, Math.sin(S.time * 3 + i) * 4); ctx.rotate(Math.sin(S.time * 2 + i) * 0.1);
    ctx.drawImage(sp.canvas, -sp.size / 2, -sp.size / 2, sp.size, sp.size);
    ctx.restore();
    if (faces.length === 1) drawCrown(x, -r - 18 + Math.sin(S.time * 3) * 4, 2);
  });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const title = final ? (faces.length === 1 ? 'NEVER CAUGHT!' : `${faces.length} ESCAPED!`) : B.text;
  fitFont(ctx, title, 460, 50, 900, 'italic');
  const tg = ctx.createLinearGradient(0, r + 18, 0, r + 62);
  tg.addColorStop(0, '#FFE57A'); tg.addColorStop(1, '#FF8A3D');
  catchText(ctx, title, 0, r + 42, tg, 8);
  const sub = faces.map(d => d.name.toUpperCase()).join(' & ');
  fitFont(ctx, sub, 440, 30, 900, 'italic');
  catchText(ctx, sub, 0, r + 86, '#FFFFFF', 6);
  ctx.restore();
}

function draw() {
  if (!canvas.width || !canvas.height || !scenery) return;   // page not laid out yet
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const d = dusk();
  ctx.drawImage(scenery.sky, 0, 0);
  if (d > 0) { ctx.globalAlpha = d; ctx.drawImage(scenery.skyDusk, 0, 0); ctx.globalAlpha = 1; }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const [sunX, sunY] = drawSun();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(scenery.land, 0, 0);
  if (d > 0) { ctx.globalAlpha = d; ctx.drawImage(scenery.landDusk, 0, 0); ctx.globalAlpha = 1; }

  const shx = S.shake ? rand(-1, 1) * S.shake : 0, shy = S.shake ? rand(-1, 1) * S.shake : 0;
  ctx.setTransform(scale, 0, 0, scale, shx * scale, shy * scale);
  drawLampGlow();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, L.stripY + 22, LW, L.panelBottom - L.stripY - 22); ctx.clip();
  drawBerries();
  drawRings();
  for (const m of S.mons) if (m.def.id === 'snorlax') drawMon(m);
  for (const m of S.mons) if (m.def.id !== 'snorlax') drawMon(m);
  for (const b of S.balls) drawBall(b);
  if (S.rocket) drawRocket(S.rocket);
  drawLockOn();
  drawFx();
  ctx.restore();

  // Lens flare, film grain and the camera overlay on top
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawFlare(sunX, sunY);
  const gs = 128 / scale * 1.5;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, L.panelTop, LW, L.panelBottom - L.panelTop); ctx.clip();
  const ox = -Math.random() * gs, oy = -Math.random() * gs;
  for (let gx = ox; gx < LW; gx += gs) for (let gy = L.panelTop + oy; gy < L.panelBottom; gy += gs) ctx.drawImage(scenery.grain, gx, gy, gs, gs);
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(scenery.overlay, 0, 0);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  drawStrip();
  drawHud();
  if (S.flash > 0) {
    ctx.fillStyle = `rgba(255,250,235,${S.flash})`;
    ctx.fillRect(-20, -20, LW + 40, LH + 40);
  }
  drawBanner();

  // Black bands (drawn last, unshaken, so nothing spills into TikTok's UI zones)
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, LW, L.panelTop);
  ctx.fillRect(0, L.panelBottom, LW, LH - L.panelBottom);
}

/* =====================================================================
   VIDEO RECORDING
   Records one full round straight from the canvas (1080×1920, 60fps, with
   sound), keeps going a few seconds into the freeze, then saves the file.
   ===================================================================== */

const params = new URLSearchParams(location.search);
// ?upload=/path  → POST the finished video to this same-origin path instead of
// downloading it (used by tools/render.py). ?autorecord → start on load.
const UPLOAD_PATH = /^\/(?!\/)/.test(params.get('upload') || '') ? params.get('upload') : null;

const Recorder = {
  on: false, rec: null, chunks: [], tail: 0, startedAt: 0, frames: 0,
  TAIL_SECONDS: 3.5,        // how long to keep filming the frozen end screen

  // Best format this browser can record: MP4 (H.264/AAC) first, WebM fallback.
  pickMime() {
    const types = [
      'video/mp4;codecs=avc1.64002A,mp4a.40.2',
      'video/mp4;codecs=avc1,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm',
    ];
    return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  },

  start() {
    if (this.on) return;
    if (!window.MediaRecorder || !canvas.captureStream) {
      alert("This browser can't record video. Try Chrome or Safari on a computer.");
      return;
    }
    Sound.unlock();
    this.on = true;
    resize();                 // lock the canvas to 1080×1920
    startRound();
    draw();

    const stream = canvas.captureStream(60);
    const audio = Sound.recordStream();
    if (audio) audio.getAudioTracks().forEach(t => stream.addTrack(t));

    const mimeType = this.pickMime();
    const opts = { videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 192_000 };
    if (mimeType) opts.mimeType = mimeType;
    this.rec = new MediaRecorder(stream, opts);
    this.chunks = [];
    this.rec.ondataavailable = e => { if (e.data.size) this.chunks.push(e.data); };
    this.rec.onstop = () => this.save();
    this.rec.start(1000);

    this.tail = this.TAIL_SECONDS;
    this.startedAt = performance.now();
    this.frames = 0;
    $('recBtn').classList.add('on');
    $('recBtn').textContent = '⏹';
    $('recBadge').hidden = false;
  },

  // Called every frame once the round is over: film the freeze, then stop.
  tick(rdt) {
    if (!this.rec) return;
    this.tail -= rdt;
    if (this.tail <= 0) this.stop();
  },

  stop() {
    if (this.rec && this.rec.state !== 'inactive') this.rec.stop();
  },

  save() {
    const type = this.rec.mimeType || 'video/webm';
    const blob = new Blob(this.chunks, { type });
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const name = `pokemon-go-ball-rain-${stamp}.${ext}`;
    const secs = (performance.now() - this.startedAt) / 1000;
    const fps = (this.frames / secs).toFixed(1);

    this.rec = null;
    this.chunks = [];
    this.on = false;
    resize();                 // back to the normal screen layout
    $('recBtn').classList.remove('on');
    $('recBtn').textContent = '⏺';
    $('recBadge').hidden = true;

    if (UPLOAD_PATH) {
      fetch(`${UPLOAD_PATH}?name=${encodeURIComponent(name)}&fps=${fps}`, { method: 'POST', body: blob });
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  },

  // On-screen REC badge with elapsed time.
  frame() {
    if (!this.on) return;
    this.frames++;
    const s = Math.floor((performance.now() - this.startedAt) / 1000);
    const text = `● REC ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    const badge = $('recBadge');
    if (badge.textContent !== text) badge.textContent = text;
  },
};

/* =====================================================================
   UI
   ===================================================================== */

const $ = id => document.getElementById(id);

$('recBtn').addEventListener('click', () => (Recorder.on ? Recorder.stop() : Recorder.start()));

// Tap a Pokémon to throw a ball at it; tap anywhere else to throw one there
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (S.timeUp || S.lastStand) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * LW;
  const y = (e.clientY - rect.top) / rect.height * LH - L.arenaTop;
  if (y < 0) return;
  const m = freeMons().find(o => (o.x - x) ** 2 + (o.y - y) ** 2 < (o.r * 2) ** 2);
  throwBall(m || null);
});

// Audio starts on load if the browser allows it. If it's blocked, any touch,
// click or key press starts it (different browsers count different events).
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  window.addEventListener(ev, () => Sound.unlock(), { capture: true });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) Sound.unlock(); });

const muteBtn = $('muteBtn');
function toggleMute() {
  Sound.setMuted(!Sound.muted);
  muteBtn.textContent = Sound.muted ? '🔇' : '🔊';
}
muteBtn.addEventListener('click', toggleMute);

const panel = $('panel');
$('setBtn').addEventListener('click', () => { panel.hidden = !panel.hidden; });
$('closeBtn').addEventListener('click', () => { panel.hidden = true; });
$('resetBtn').addEventListener('click', () => { startRound(); panel.hidden = true; });

// Bind a slider to a Settings key with a formatted readout
function bindSlider(inputId, labelId, key, fmtVal) {
  const input = $(inputId), label = $(labelId);
  input.value = Settings[key];
  label.textContent = fmtVal(Settings[key]);
  input.addEventListener('input', () => {
    Settings[key] = parseFloat(input.value);
    label.textContent = fmtVal(Settings[key]);
  });
}
bindSlider('inThrow', 'vThrow', 'throws', v => v.toFixed(2) + '×');
bindSlider('inMoves', 'vMoves', 'moves', v => (v ? v.toFixed(1) + '×' : 'off'));

// Keyboard shortcuts for desktop recording: M = mute, R = restart the round
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === 'r' || e.key === 'R') startRound();
});

window.addEventListener('resize', resize);

/* =====================================================================
   MAIN LOOP
   ===================================================================== */

resize();
startRound();
Sound.unlock();     // try to start sound right away
if (params.has('autorecord')) Recorder.start();

let lastT = performance.now();
function frame(now) {
  // Never negative (the first rAF timestamp can be earlier than lastT), capped after tab switches
  const rdt = clamp((now - lastT) / 1000, 0, 1 / 20);
  lastT = now;
  try {
    update(rdt);
    draw();
  } catch (err) {
    console.error(err);     // log it (render.py prints these) but keep the loop alive
  }
  Recorder.frame();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
