      g.beginPath(); g.moveTo(s * 0.35, -0.7); g.lineTo(s * 1.45, -0.72); g.lineTo(s * 0.92, 0.0); g.closePath(); ink(g, '#2E4A8A');
      dot(g, s * 1.0, -0.5, 0.06, '#E8423A');
    }
    ballBase(g, '#6E8ED8', '#24366E');
    inside(g, () => { ell(g, 0, 0.8, 0.95, 0.52); g.fillStyle = '#D9504A'; g.fill(); });
    for (const s of [-1, 1]) { ell(g, s * 0.38, -0.22, 0.17, 0.11, s * 0.3); ink(g, '#FFD23F', 0.05); dot(g, s * 0.36, -0.2, 0.06, '#111111'); }
    g.beginPath(); g.moveTo(-0.62, 0.22); g.quadraticCurveTo(0, 0.45, 0.62, 0.22); g.lineWidth = 0.06; g.strokeStyle = INK; g.stroke();
    fangs(g, -0.55, 0.55, 0.26, 7, 0.12);
    ballDone(g);
  },
  metagross(g) {                                       // steel disk with a silver X
    ballBase(g, '#9FC4EA', '#36628F');
    seg(g, -0.62, -0.62, 0.62, 0.62, 0.36, INK); seg(g, 0.62, -0.62, -0.62, 0.62, 0.36, INK);
    seg(g, -0.62, -0.62, 0.62, 0.62, 0.26, '#DDE6EE'); seg(g, 0.62, -0.62, -0.62, 0.62, 0.26, '#DDE6EE');
    for (const s of [-1, 1]) { ell(g, s * 0.5, 0.12, 0.12, 0.07, -s * 0.3); ink(g, '#E8423A', 0.04); }
    ballDone(g);
  },
  scizor(g) {                                          // red steel mantis
    for (const s of [-1, 1]) {
      g.beginPath(); g.moveTo(s * 0.12, -0.9); g.lineTo(s * 0.5, -1.4); g.lineTo(s * 0.45, -0.85); g.closePath(); ink(g, '#C42A30');
    }
    ballBase(g, '#FF7A7A', '#B5141A');
    for (const s of [-1, 1]) bigEye(g, s * 0.36, -0.1, 0.2, 0.22, '#F2C21B');
    ell(g, 0, 0.45, 0.32, 0.16); ink(g, '#4A4A52', 0.05);
    ballDone(g);
  },
};

/* Mewtwo, the raid boss: a full figure in logical units, chest at (0, 0). */
function drawMewtwo(g) {
  const body = '#E2D8EC', shade = '#A99AC4', purple = '#8E57C0', dark = INK;
  const fill = (col, w = 2.4) => { g.fillStyle = col; g.fill(); g.lineWidth = w; g.strokeStyle = dark; g.stroke(); };
  g.lineJoin = 'round'; g.lineCap = 'round';
  // tail: thick purple, curling up to the right
  g.beginPath(); g.moveTo(14, 74); g.bezierCurveTo(90, 120, 168, 60, 132, -18);
  g.lineWidth = 30; g.strokeStyle = dark; g.stroke();
  g.lineWidth = 24; g.strokeStyle = purple; g.stroke();
  circ(g, 132, -20, 14); fill(purple);
  // the tube from the back of the head to the spine
  g.beginPath(); g.moveTo(-14, -104); g.bezierCurveTo(-62, -112, -66, -64, -30, -48);
  g.lineWidth = 13; g.strokeStyle = dark; g.stroke();
  g.lineWidth = 8; g.strokeStyle = shade; g.stroke();
  // legs
  for (const s of [-1, 1]) {
    ell(g, s * 30, 84, 22, 34, s * 0.35); fill(body);
    ell(g, s * 42, 128, 13, 24, s * 0.15); fill(body);
    ell(g, s * 46, 152, 15, 8); fill(shade);
  }
  // torso
  g.beginPath(); g.moveTo(-52, -36); g.quadraticCurveTo(-42, 12, -26, 56); g.quadraticCurveTo(0, 72, 26, 56); g.quadraticCurveTo(42, 12, 52, -36); g.quadraticCurveTo(0, -58, -52, -36); g.closePath();
  const tg = g.createLinearGradient(-50, -40, 50, 60); tg.addColorStop(0, '#F4EEF8'); tg.addColorStop(1, shade);
  fill(tg);
  g.save(); g.clip();
  ell(g, 0, 50, 34, 30); g.fillStyle = purple; g.fill();
  g.restore();
  // arms, raised a little, with three round fingers
  for (const s of [-1, 1]) {
    g.beginPath(); g.moveTo(s * 46, -28); g.quadraticCurveTo(s * 82, -6, s * 84, 34);
    g.lineWidth = 17; g.strokeStyle = dark; g.stroke(); g.lineWidth = 12; g.strokeStyle = body; g.stroke();
    for (let k = -1; k <= 1; k++) { circ(g, s * (84 + k * 6), 44 + Math.abs(k) * -2, 5.5); fill(body, 1.8); }
  }
  // neck + head
  ell(g, 0, -60, 13, 14); fill(body);
  g.beginPath(); g.moveTo(-34, -96); g.quadraticCurveTo(-36, -134, 0, -134); g.quadraticCurveTo(36, -134, 34, -96); g.quadraticCurveTo(26, -64, 0, -66); g.quadraticCurveTo(-26, -64, -34, -96); g.closePath();
  const hg = g.createLinearGradient(-30, -134, 30, -66); hg.addColorStop(0, '#F8F4FA'); hg.addColorStop(1, '#C2B4D8');
  // horn-ears
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 14, -128); g.quadraticCurveTo(s * 22, -152, s * 32, -146); g.quadraticCurveTo(s * 34, -128, s * 28, -116); g.closePath(); fill(body); }
  g.beginPath(); g.moveTo(-34, -96); g.quadraticCurveTo(-36, -134, 0, -134); g.quadraticCurveTo(36, -134, 34, -96); g.quadraticCurveTo(26, -64, 0, -66); g.quadraticCurveTo(-26, -64, -34, -96); g.closePath();
  fill(hg);
  // stern purple eyes
  for (const s of [-1, 1]) {
    g.beginPath(); g.moveTo(s * 7, -100); g.quadraticCurveTo(s * 18, -108, s * 26, -104); g.quadraticCurveTo(s * 20, -94, s * 9, -95); g.closePath();
    g.fillStyle = '#7A2FB8'; g.fill(); g.lineWidth = 1.6; g.strokeStyle = dark; g.stroke();
    circ(g, s * 16, -100, 2.2); g.fillStyle = '#FFFFFF'; g.fill();
    seg(g, s * 6, -108, s * 26, -114, 2.6, dark);
  }
  seg(g, -6, -78, 6, -78, 1.8, dark);
}

/* =====================================================================
   RENDERING
   ===================================================================== */

const sprites = new Map();

function getSprite(id, r) {
  const key = `${id}|${r}`;
  let s = sprites.get(key);
  if (s) return s;
  const size = r * 2 * 2.0;
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(size * scale);
  const g = c.getContext('2d');
  g.scale(c.width / size, c.height / size);
  g.translate(size / 2, size / 2);
  g.scale(r, r);
  g.lineJoin = 'round';
  FACES[id](g);
  s = { canvas: c, size };
  sprites.set(key, s);
  return s;
}

// Mewtwo, cached once (380×380 logical, chest at the center).
function getBossSprite() {
  let s = sprites.get('boss');
  if (s) return s;
  const size = 380;
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(size * scale);
  const g = c.getContext('2d');
  g.scale(c.width / size, c.height / size);
  g.translate(size / 2 - 20, size / 2 + 4);
  drawMewtwo(g);
  s = { canvas: c, size, ox: size / 2 - 20, oy: size / 2 + 4 };
  sprites.set('boss', s);
  return s;
}

/* The raid storm: a purple-magenta sky, a swirling vortex behind the boss,
   floating crystal shards, distant spires, and the raid platform. */
let backdrop = null, vortex = null, hookLayer = null;
function buildBackdrop() {
  backdrop = document.createElement('canvas');
  backdrop.width = canvas.width;
  backdrop.height = canvas.height;
  const g = backdrop.getContext('2d');
  g.scale(scale, scale);
  g.translate(0, L.block);
  const sky = g.createRadialGradient(BOSS_X, BOSS_Y - 40, 20, BOSS_X, BOSS_Y, 620);
  sky.addColorStop(0, '#C23C9A'); sky.addColorStop(0.3, '#6A1E86'); sky.addColorStop(0.65, '#2A0E4A'); sky.addColorStop(1, '#0E0620');
  g.fillStyle = sky;
  g.fillRect(0, -L.block, LW, LH);
  const rnd = seeded(13);
  for (let i = 0; i < 70; i++) {                                // sparkles in the storm
    g.fillStyle = `rgba(255,200,255,${0.2 + rnd() * 0.5})`;
    circ(g, rnd() * LW, TOP_SPACE + rnd() * 700, 0.5 + rnd() * 1.2); g.fill();
  }
  // distant crystal spires on the horizon
  for (let i = 0; i < 9; i++) {
    const x = rnd() * LW, h = 60 + rnd() * 110, w = 16 + rnd() * 22, y = PY - 40;
    g.beginPath(); g.moveTo(x - w / 2, y); g.lineTo(x - w * 0.2, y - h); g.lineTo(x + w * 0.1, y - h - 18); g.lineTo(x + w / 2, y); g.closePath();
    const cg = g.createLinearGradient(x, y - h, x, y);
    cg.addColorStop(0, 'rgba(255,140,230,0.55)'); cg.addColorStop(1, 'rgba(60,20,90,0.2)');
    g.fillStyle = cg; g.fill();
  }
  // storm floor glow + the raid platform
  const fl = g.createLinearGradient(0, PY - 120, 0, PY + 140);
  fl.addColorStop(0, 'rgba(20,6,40,0)'); fl.addColorStop(1, 'rgba(20,6,40,0.9)');
  g.fillStyle = fl; g.fillRect(0, PY - 120, LW, 260);
  g.save();
  g.shadowColor = '#F06BC8'; g.shadowBlur = blur(30);
  ell(g, PX, PY + 12, PRX + 6, PRY + 6); g.fillStyle = '#3A1450'; g.fill();
  g.restore();
  ell(g, PX, PY + 12, PRX, PRY); g.fillStyle = '#2A0E3C'; g.fill();          // the platform's side
  const top = g.createRadialGradient(PX, PY - 20, 10, PX, PY, PRX);
  top.addColorStop(0, '#6A4A86'); top.addColorStop(1, '#3E2656');
  ell(g, PX, PY, PRX, PRY); g.fillStyle = top; g.fill();
  g.lineWidth = 4; g.strokeStyle = '#F06BC8'; g.stroke();
  g.strokeStyle = 'rgba(255,170,240,0.35)'; g.lineWidth = 1.5;
  for (const k of [0.33, 0.66]) { ell(g, PX, PY, PRX * k, PRY * k); g.stroke(); }
  for (let i = 0; i < 12; i++) {                                // spokes
    const a = i / 12 * TAU;
    g.beginPath(); g.moveTo(PX + Math.cos(a) * PRX * 0.33, PY + Math.sin(a) * PRY * 0.33); g.lineTo(PX + Math.cos(a) * PRX * 0.97, PY + Math.sin(a) * PRY * 0.97); g.stroke();
  }
  // raid emblem in the middle (a Poké Ball outline)
  g.save(); g.translate(PX, PY); g.scale(1, PRY / PRX);
  g.strokeStyle = 'rgba(255,170,240,0.55)'; g.lineWidth = 3;
  circ(g, 0, 0, 34); g.stroke(); seg(g, -34, 0, 34, 0, 3, 'rgba(255,170,240,0.55)'); circ(g, 0, 0, 10); g.stroke();
  g.restore();

  // The hook goes in its own layer, drawn over the turning vortex
  hookLayer = document.createElement('canvas');
  hookLayer.width = canvas.width;
  hookLayer.height = canvas.height;
  const hg = hookLayer.getContext('2d');
  hg.scale(scale, scale);
  hg.translate(0, L.block);
  drawHook(hg);

  // the vortex (rotated every frame)
  vortex = document.createElement('canvas');
  const vs = 520;
  vortex.width = vortex.height = Math.ceil(vs * scale);
  const v = vortex.getContext('2d');
  v.scale(scale, scale); v.translate(vs / 2, vs / 2);
  for (let arm = 0; arm < 5; arm++) {
    v.beginPath();
    for (let t = 0; t < 1; t += 0.01) {
      const a = arm * TAU / 5 + t * 5.2, r = 20 + t * 240;
      v.lineTo(Math.cos(a) * r, Math.sin(a) * r * 0.85);
    }
    v.lineWidth = 16; v.strokeStyle = 'rgba(255,140,230,0.10)'; v.stroke();
    v.lineWidth = 4; v.strokeStyle = 'rgba(255,190,245,0.18)'; v.stroke();
  }
}

function drawHook(g) {
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  const ty = L.panelTop - L.block;
  fitFont(g, HOOK[0], 250, 17, 700);
  roundRect(g, L.cx - 100, ty + 24 - 15, 200, 30, 15); g.fillStyle = 'rgba(20,6,40,0.7)'; g.fill();
  g.lineWidth = 1.5; g.strokeStyle = 'rgba(240,107,200,0.7)'; g.stroke();
  g.fillStyle = '#FFFFFF'; g.fillText(HOOK[0], L.cx, ty + 25);
  fitFont(g, HOOK[1], 470, 46, 800);
  raidText(g, HOOK[1], L.cx, ty + 66, '#FFFFFF', '#F06BC8', 8);
  fitFont(g, HOOK[2], 480, 48, 800);
  const gr = g.createLinearGradient(0, ty + 88, 0, ty + 132);
  gr.addColorStop(0, '#FFC2F0'); gr.addColorStop(0.5, '#F06BC8'); gr.addColorStop(1, '#B03FE0');
  raidText(g, HOOK[2], L.cx, ty + 110, gr, '#FFFFFF', 8);
}

function drawBoss() {
  const B = S.boss;
  const sp = getBossSprite();
  const bob = Math.sin(S.time * 1.6) * 6;
  let alpha = 1, k = 1;
  if (B.tpT > 0) alpha = B.tpT > 0.8 ? clamp((1.1 - B.tpT) / 0.3, 0, 1) * -1 + 1 : B.tpT > 0.5 ? 0 : clamp((0.5 - B.tpT) / 0.4, 0, 1);
  if (S.won) { k = Math.max(0, 1 - B.defeatT / 1.6); alpha = k; }
  const intro = easeOutBack(clamp(B.introT / 0.8, 0, 1));
  if (alpha <= 0 || intro <= 0) return;
  const x = B.x, y = B.y + bob;
  // shadow on the platform
  ell(ctx, x, PY - PRY * 0.55, 70 * k, 14 * k); ctx.fillStyle = 'rgba(10,0,20,0.35)'; ctx.fill();
  // psychic aura
  ctx.save();
  ctx.globalAlpha = alpha;
  const pulse = 0.5 + 0.5 * Math.sin(S.time * 4);
  const ag = ctx.createRadialGradient(x, y - 20, 20, x, y - 20, 190);
  ag.addColorStop(0, B.enraged ? 'rgba(255,60,90,0.55)' : 'rgba(255,120,230,0.5)');
  ag.addColorStop(1, 'rgba(255,120,230,0)');
  ctx.fillStyle = ag; circ(ctx, x, y - 20, 190); ctx.fill();
  ctx.strokeStyle = B.enraged ? 'rgba(255,90,110,0.6)' : 'rgba(255,170,240,0.5)'; ctx.lineWidth = 2;
  for (let i = 0; i < 2; i++) { ell(ctx, x, y + 10, 130 + i * 20 + pulse * 6, 30 + i * 6, S.time * (i ? -0.6 : 0.8)); ctx.stroke(); }
  ctx.translate(x, y);
  const sc = 0.86 * intro * k;
  ctx.scale(sc, sc);
  if (B.hurtT > 0) ctx.filter = 'brightness(1.35)';
  ctx.drawImage(sp.canvas, -sp.ox, -sp.oy, sp.size, sp.size);
  ctx.filter = 'none';
  // glowing eyes and hands while it attacks
  if (B.castT > 0 || B.enraged) {
    const gl = B.castT > 0 ? B.castT / 0.6 : 0.4;
    ctx.globalCompositeOperation = 'lighter';
    for (const s of [-1, 1]) {
      const hg = ctx.createRadialGradient(s * 84, 44, 0, s * 84, 44, 34);
      hg.addColorStop(0, `rgba(255,150,240,${0.9 * gl})`); hg.addColorStop(1, 'rgba(255,150,240,0)');
      ctx.fillStyle = hg; circ(ctx, s * 84, 44, 34); ctx.fill();
      const eg = ctx.createRadialGradient(s * 16, -100, 0, s * 16, -100, 14);
      eg.addColorStop(0, `rgba(255,120,255,${gl})`); eg.addColorStop(1, 'rgba(255,120,255,0)');
      ctx.fillStyle = eg; circ(ctx, s * 16, -100, 14); ctx.fill();
    }
  }
  ctx.restore();
  // Barrier: a hexagon shield
  if (B.barrierT > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, B.barrierT * 2) * (0.75 + 0.25 * Math.sin(S.time * 10));
    ctx.translate(x, y - 10);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + Math.PI / 6; ctx.lineTo(Math.cos(a) * 165, Math.sin(a) * 175); }
    ctx.closePath();
    ctx.fillStyle = 'rgba(160,225,255,0.16)'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = '#BFF0FF'; ctx.stroke();
    ctx.strokeStyle = 'rgba(190,240,255,0.35)'; ctx.lineWidth = 1.5;
    for (let r = 40; r < 165; r += 42) { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + Math.PI / 6; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r * 1.06); } ctx.closePath(); ctx.stroke(); }
    ctx.restore();
  }
  if (S.won && B.defeatT < 1.6) {                              // dissolving into light
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createRadialGradient(x, y - 20, 0, x, y - 20, 200 * (0.5 + B.defeatT));
    lg.addColorStop(0, `rgba(255,240,200,${0.8 * (1 - B.defeatT / 1.6)})`); lg.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = lg; circ(ctx, x, y - 20, 200 * (0.5 + B.defeatT)); ctx.fill();
    ctx.restore();
  }
}

function drawHazards() {
  for (const h of S.hazards) {
    if (h.t < 0) continue;
    const p = clamp(h.t / h.dur, 0, 1);
    if (h.kind === 'ring') {
      if (h.done) continue;
      const R = p * 1.1;
      ctx.save();
      ctx.globalAlpha = 1 - p * 0.4;
      ell(ctx, PX, PY, PRX * R, PRY * R); ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(255,90,200,0.35)'; ctx.stroke();
      ctx.lineWidth = 3; ctx.strokeStyle = '#FFC2F0'; ctx.stroke();
      ctx.restore();
      continue;
    }
    if (!h.done) {                                               // the warning circle on the floor
      const pr = h.kind === 'psystrike' ? '#FF4D8A' : '#A86BF0';
      ctx.save();
      ell(ctx, h.x, h.y, h.r, h.r / 2.2); ctx.fillStyle = rgba(pr, 0.12 + 0.18 * p); ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = rgba(pr, 0.9); ctx.setLineDash([6, 5]); ctx.lineDashOffset = -S.time * 30; ctx.stroke();
      ctx.setLineDash([]);
      ell(ctx, h.x, h.y, h.r * p, h.r * p / 2.2); ctx.fillStyle = rgba(pr, 0.3); ctx.fill();
      ctx.restore();
    }
    if (h.kind === 'shadow' && !h.done) {                       // the Shadow Ball in flight
      const x = lerp(h.sx, h.x, p), y = lerp(h.sy, h.y, p) - Math.sin(p * Math.PI) * 70;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 16);
      g.addColorStop(0, '#E0C2FF'); g.addColorStop(0.4, '#7A3FD0'); g.addColorStop(1, 'rgba(40,10,70,0)');
      ctx.fillStyle = g; circ(ctx, x, y, 16); ctx.fill();
      circ(ctx, x, y, 7); ctx.fillStyle = '#2A0E4A'; ctx.fill();
    }
    if (h.kind === 'psystrike' && h.done && h.t < h.dur + 0.3) {   // pillar of psychic light
      const k = 1 - (h.t - h.dur) / 0.3;
      const g = ctx.createLinearGradient(h.x - h.r, 0, h.x + h.r, 0);
      g.addColorStop(0, 'rgba(255,120,220,0)'); g.addColorStop(0.5, `rgba(255,230,250,${0.85 * k})`); g.addColorStop(1, 'rgba(255,120,220,0)');
      ctx.fillStyle = g; ctx.fillRect(h.x - h.r, ARENA_TOP, h.r * 2, h.y - ARENA_TOP);
    }
  }
}

function drawAttacker(a) {
  const d = depth(a.y), r = a.r * d;
  let y = a.y, alpha = 1, k = 1;
  if (a.state === 'drop') { const p = clamp(a.dropT, 0, 1); y = a.y - (1 - easeOut(p)) * 260; alpha = p; }
  if (a.state === 'faint') { k = 1 - clamp(a.faintT / 0.6, 0, 1); alpha = k; }
  if (k <= 0 || alpha <= 0) return;
  ell(ctx, a.x, a.y + 2, r * 0.9, r * 0.32); ctx.fillStyle = 'rgba(10,0,20,0.4)'; ctx.fill();
  const sp = getSprite(a.def.id, a.r);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(a.x, y - r - a.hop);
  ctx.scale(d * k * (a.face < 0 ? -1 : 1), d * k);
  if (a.hurtT > 0) ctx.filter = 'brightness(1.8)';
  ctx.drawImage(sp.canvas, -sp.size / 2, -sp.size / 2, sp.size, sp.size);
  ctx.filter = 'none';
  ctx.restore();
  if (a.state !== 'in') return;
  // HP bar + charge meter
  const w = 30 * d, bx = a.x - w / 2, by = a.y + 7;
  ctx.fillStyle = 'rgba(10,0,20,0.75)'; ctx.fillRect(bx - 1, by - 1, w + 2, 6);
  const f = clamp(a.hp / a.maxHp, 0, 1);
  ctx.fillStyle = a.def.mega ? '#B05AF0' : f > 0.5 ? '#5FE07A' : f > 0.25 ? '#FFD23F' : '#FF4D4D';
  ctx.fillRect(bx, by, w * f, 2.5);
  ctx.fillStyle = '#6CC8FF'; ctx.fillRect(bx, by + 3, w * clamp(a.energy / 100, 0, 1), 1.5);
  if (a.def.mega) {
    ctx.save(); ctx.font = `700 9px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#E0C2FF';
    ctx.fillText('MEGA', a.x, by + 15); ctx.restore();
  }
}

function drawShots() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const sh of S.shots) {
    const p = clamp(sh.t / sh.dur, 0, 1);
    const x = lerp(sh.x0, sh.x1, p), y = lerp(sh.y0, sh.y1, p) + Math.sin(p * Math.PI) * sh.arc;
    const r = sh.big ? 13 : 4.5;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.35, sh.color); g.addColorStop(1, rgba(sh.color, 0));
    ctx.fillStyle = g; circ(ctx, x, y, r * 2); ctx.fill();
    if (sh.big) {                                              // a comet tail for charged attacks
      for (let i = 1; i <= 4; i++) {
        const q = Math.max(0, p - i * 0.05);
        const tx = lerp(sh.x0, sh.x1, q), ty = lerp(sh.y0, sh.y1, q) + Math.sin(q * Math.PI) * sh.arc;
        ctx.fillStyle = rgba(sh.color, 0.25 / i); circ(ctx, tx, ty, r * (1.2 - i * 0.15)); ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawFx() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of S.fx) {
    const t = 1 - f.life / f.max;
    if (f.kind === 'ring') {
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.width * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0, f.r0 + (f.r1 - f.r0) * easeOut(t)), 0, TAU); ctx.stroke();
    } else if (f.kind === 'spark') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = f.color;
      circ(ctx, f.x, f.y, f.size * (1 - t * 0.5)); ctx.fill();
    } else if (f.kind === 'confetti') {
      ctx.globalAlpha = t < 0.85 ? 1 : (1 - t) / 0.15;
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
      ctx.fillStyle = f.color; ctx.fillRect(-f.size / 2, -f.size / 4, f.size, f.size / 2);
      ctx.restore();
    } else if (f.kind === 'plus') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = '#7CF29A'; ctx.fillRect(f.x - 5, f.y - 1.5, 10, 3); ctx.fillRect(f.x - 1.5, f.y - 5, 3, 10);
    } else if (f.kind === 'heart') {
      ctx.globalAlpha = 1 - t;
      ctx.save(); ctx.translate(f.x, f.y); ctx.scale(0.8, 0.8);
      ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-12, -2, -6, -12, 0, -5); ctx.bezierCurveTo(6, -12, 12, -2, 0, 6);
      ctx.fillStyle = '#FF7AB8'; ctx.fill(); ctx.restore();
    }
  }
  for (const f of S.fx) {
    if (f.kind !== 'float') continue;
    const t = 1 - f.life / f.max;
    const pop = t < 0.12 ? 0.5 + 0.5 * easeOutBack(t / 0.12) : 1;
    ctx.globalAlpha = t < 0.75 ? 1 : (1 - t) / 0.25;
    const y = f.y - 24 * easeOut(t), x = clamp(f.x, 80, 410);
    fitFont(ctx, f.text, 280, f.size * pop, 800);
    ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.strokeText(f.text, x, y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, x, y);
  }
  ctx.restore();
}

// The boss HP bar, like a raid in the game, with the active boosts under it.
function drawBossBar() {
  const B = S.boss, f = hpFrac();
  const x0 = 20, w = 500, y = L.barY - L.block, h = 26;
  ctx.save();
  roundRect(ctx, x0 - 3, y - h / 2 - 3, w + 6, h + 6, 10); ctx.fillStyle = INK; ctx.fill();
  roundRect(ctx, x0, y - h / 2, w, h, 8); ctx.fillStyle = '#3A1A4E'; ctx.fill();
  if (f > 0) {
    ctx.save(); roundRect(ctx, x0, y - h / 2, w, h, 8); ctx.clip();
    const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);
    const col = f > 0.5 ? ['#5FE07A', '#2FB86A'] : f > 0.2 ? ['#FFE15A', '#F2A93A'] : ['#FF6A6A', '#E0283A'];
    g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
    ctx.fillStyle = g; ctx.fillRect(x0, y - h / 2, w * f, h);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x0, y - h / 2, w * f, h * 0.38);
    if (B.hurtT > 0) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x0, y - h / 2, w * f, h); }
    ctx.restore();
  }
  // where the bar "should" be to finish on time is not shown — viewers guess!
  ctx.textBaseline = 'middle';
  ctx.font = `700 15px ${FONT}`; ctx.textAlign = 'left';
  ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.strokeStyle = INK;
  ctx.strokeText('MEWTWO', x0 + 10, y + 1); ctx.fillStyle = '#FFFFFF'; ctx.fillText('MEWTWO', x0 + 10, y + 1);
  ctx.textAlign = 'right';
  const p = f * 100, pct = f <= 0 ? '0%' : p < 1 ? p.toFixed(1) + '%' : Math.ceil(p) + '%';
  ctx.strokeText(pct, x0 + w - 10, y + 1); ctx.fillStyle = '#FFFFFF'; ctx.fillText(pct, x0 + w - 10, y + 1);
  if (B.barrierT > 0) { ctx.textAlign = 'center'; ctx.strokeText('BARRIER', x0 + w / 2, y + 1); ctx.fillStyle = '#BFF0FF'; ctx.fillText('BARRIER', x0 + w / 2, y + 1); }
  // active boosts
  const tags = S.boosts.map(b => b.name);
  if (B.enraged && !S.won) tags.push('ENRAGED');
  let tx = x0;
  ctx.font = `700 11px ${FONT}`; ctx.textAlign = 'center';
  for (const t of tags) {
    const tw = ctx.measureText(t).width + 16;
    roundRect(ctx, tx, y + h / 2 + 6, tw, 17, 8.5);
    ctx.fillStyle = t === 'ENRAGED' ? '#E0283A' : t === 'MEGA' ? '#8E3FD0' : t === 'FOG' ? '#5A6A9A' : '#D94F9A'; ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.fillText(t, tx + tw / 2, y + h / 2 + 15);
    tx += tw + 6;
  }
  ctx.restore();
}

// Raid timer (left) and trainers in the raid (right).
function drawHud() {
  const secs = Math.max(0, Math.ceil(S.clock));
  const text = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  const urgent = !S.timeUp && S.clock <= 10;
  const pulse = urgent ? 1 + 0.12 * Math.pow(S.clock - Math.floor(S.clock), 3) : 1;
  const y = L.hudY - L.block;
  const pill = (x, w, color) => {
    roundRect(ctx, x - w / 2, y - 18, w, 36, 18); ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#F06BC8'; ctx.stroke();
  };
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(64, y); ctx.scale(pulse, pulse); ctx.translate(-64, -y);
  pill(64, 100, urgent || S.timeUp ? '#C81E3C' : 'rgba(20,6,40,0.8)');
  circ(ctx, 34, y, 9); ctx.lineWidth = 2.2; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
  seg(ctx, 34, y, 34, y - 5, 2, '#FFFFFF'); seg(ctx, 34, y, 38, y + 1, 2, '#FFFFFF');
  ctx.font = `700 22px ${FONT}`; ctx.fillStyle = '#FFFFFF';
  ctx.fillText(text, 74, y + 1);
  ctx.restore();
  pill(474, 104, 'rgba(20,6,40,0.8)');
  for (const [dx, k] of [[-6, 0.8], [0, 1]]) {                   // people icon
    circ(ctx, 440 + dx, y - 5 * k, 4.5 * k); ctx.fillStyle = k < 1 ? '#C9A3E8' : '#FFFFFF'; ctx.fill();
    ctx.beginPath(); ctx.arc(440 + dx, y + 8 * k, 7.5 * k, Math.PI, TAU); ctx.fill();
  }
  fitFont(ctx, `${S.slots.length} TRAINERS`, 66, 13, 700);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(`${S.slots.length} TRAINERS`, 489, y + 1);
  ctx.restore();
}

function drawBanner() {
  const B = S.banner;
  if (!B) return;
  const age = B.max - B.life;
  const inT = clamp(age / 0.25, 0, 1), outT = clamp(B.life / 0.3, 0, 1);
  if (B.final) { drawFinal(B); return; }
  const y = ARENA_TOP + 52;
  ctx.save();
  ctx.globalAlpha = Math.min(outT, inT * 2);
  ctx.translate(245, y);
  ctx.scale(0.6 + 0.4 * easeOutBack(inT), 0.6 + 0.4 * easeOutBack(inT));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const g = ctx.createLinearGradient(-240, 0, 240, 0);
  g.addColorStop(0, rgba(B.color, 0)); g.addColorStop(0.15, rgba(B.color, 0.55)); g.addColorStop(0.85, rgba(B.color, 0.55)); g.addColorStop(1, rgba(B.color, 0));
  ctx.fillStyle = 'rgba(14,4,28,0.82)'; ctx.fillRect(-250, -36, 500, 72);
  ctx.fillStyle = g; ctx.fillRect(-250, -36, 500, 3); ctx.fillRect(-250, 33, 500, 3);
  fitFont(ctx, B.text, 450, 34, 800);
  raidText(ctx, B.text, 0, -8, '#FFFFFF', B.color, 6);
  fitFont(ctx, B.sub, 440, 15, 600);
  ctx.fillStyle = lighten(B.color, 0.6); ctx.fillText(B.sub, 0, 20);
  ctx.restore();
}

// 0:00: RAID WON! or RAID FAILED!
function drawFinal(B) {
  ctx.save();
  ctx.fillStyle = B.won ? 'rgba(20,6,40,0.35)' : 'rgba(30,0,10,0.45)';
  const top = L.barY - L.block + 17;
  ctx.fillRect(0, top, LW, 960 - BOTTOM_SPACE - top);
  ctx.translate(245, BOSS_Y - 10);
  if (B.won) {
    ctx.save(); ctx.rotate(S.time * 0.4);
    ctx.fillStyle = 'rgba(255,230,150,0.14)';
    for (let i = 0; i < 14; i++) { ctx.rotate(TAU / 14); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-18, -260); ctx.lineTo(18, -260); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fitFont(ctx, B.text, 470, 64, 800);
  const g = ctx.createLinearGradient(0, -36, 0, 30);
  if (B.won) { g.addColorStop(0, '#FFF6C2'); g.addColorStop(1, '#FFB52A'); } else { g.addColorStop(0, '#FFC2C8'); g.addColorStop(1, '#FF3B5C'); }
  raidText(ctx, B.text, 0, 0, g, B.won ? '#FFD23F' : '#FF3B5C', 10);
  fitFont(ctx, B.sub, 460, 24, 700);
  ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.strokeText(B.sub, 0, 52);
  ctx.fillStyle = '#FFFFFF'; ctx.fillText(B.sub, 0, 52);
  ctx.restore();
}

function draw() {
  if (!canvas.width || !canvas.height || !hookLayer) return;   // page not laid out yet
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(backdrop, 0, 0);
  const sx = S.shake ? rand(-1, 1) * S.shake : 0, sy = S.shake ? rand(-1, 1) * S.shake : 0;
  ctx.setTransform(scale, 0, 0, scale, sx * scale, (L.block + sy) * scale);

  ctx.save();
  ctx.beginPath(); ctx.rect(-10, TOP_SPACE, LW + 20, 960 - BOTTOM_SPACE - TOP_SPACE); ctx.clip();
  // the vortex turning behind the boss
  ctx.save();
  ctx.translate(S.boss.x, BOSS_Y - 30); ctx.rotate(-S.time * 0.35);
  ctx.globalAlpha = S.boss.enraged ? 1 : 0.8;
  ctx.drawImage(vortex, -260, -260, 520, 520);
  ctx.restore();
  if (S.bolt > 0) { ctx.fillStyle = `rgba(255,220,255,${S.bolt * 1.2})`; ctx.fillRect(0, TOP_SPACE, LW, 960 - TOP_SPACE - BOTTOM_SPACE); }
  drawBoss();
  drawHazards();
  const order = S.squad.slice().sort((a, b) => a.y - b.y);
  for (const a of order) drawAttacker(a);
  drawShots();
  drawFx();
  ctx.restore();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(hookLayer, 0, 0);
  ctx.setTransform(scale, 0, 0, scale, 0, L.block * scale);
  drawBossBar();
  drawHud();
  if (S.flash > 0) {
    ctx.fillStyle = `rgba(255,235,255,${S.flash})`;
    ctx.fillRect(-20, -L.block - 20, LW + 40, LH + 40);
  }
  drawBanner();

  // Black bands (drawn last, unshaken, so nothing spills into TikTok's UI zones)
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, LW, L.panelTop);
  ctx.fillRect(0, L.panelBottom, LW, LH - L.panelBottom);
}

/* =====================================================================
   VIDEO RECORDING
   Records one full round straight from the canvas (1080×1920, 60fps, with
   sound), keeps going a few seconds into the freeze, then saves the file.
   ===================================================================== */

const params = new URLSearchParams(location.search);
// ?upload=/path  → POST the finished video to this same-origin path instead of
// downloading it (used by tools/render.py). ?autorecord → start on load.
const UPLOAD_PATH = /^\/(?!\/)/.test(params.get('upload') || '') ? params.get('upload') : null;

const Recorder = {
  on: false, rec: null, chunks: [], tail: 0, startedAt: 0, frames: 0,
  TAIL_SECONDS: 3.5,        // how long to keep filming the frozen end screen

  // Best format this browser can record: MP4 (H.264/AAC) first, WebM fallback.
  pickMime() {
    const types = [
      'video/mp4;codecs=avc1.64002A,mp4a.40.2',
      'video/mp4;codecs=avc1,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm',
    ];
    return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  },

  start() {
    if (this.on) return;
    if (!window.MediaRecorder || !canvas.captureStream) {
      alert("This browser can't record video. Try Chrome or Safari on a computer.");
      return;
    }
    Sound.unlock();
    this.on = true;
    resize();                 // lock the canvas to 1080×1920
    startRound();
    draw();

    const stream = canvas.captureStream(60);
    const audio = Sound.recordStream();
    if (audio) audio.getAudioTracks().forEach(t => stream.addTrack(t));

    const mimeType = this.pickMime();
    const opts = { videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 192_000 };
    if (mimeType) opts.mimeType = mimeType;
    this.rec = new MediaRecorder(stream, opts);
    this.chunks = [];
    this.rec.ondataavailable = e => { if (e.data.size) this.chunks.push(e.data); };
    this.rec.onstop = () => this.save();
    this.rec.start(1000);

    this.tail = this.TAIL_SECONDS;
    this.startedAt = performance.now();
    this.frames = 0;
    $('recBtn').classList.add('on');
    $('recBtn').textContent = '⏹';
    $('recBadge').hidden = false;
  },

  // Called every frame once the round is over: film the freeze, then stop.
  tick(rdt) {
    if (!this.rec) return;
    this.tail -= rdt;
    if (this.tail <= 0) this.stop();
  },

  stop() {
    if (this.rec && this.rec.state !== 'inactive') this.rec.stop();
  },

  save() {
    const type = this.rec.mimeType || 'video/webm';
    const blob = new Blob(this.chunks, { type });
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const name = `pokemon-go-raid-${stamp}.${ext}`;
    const secs = (performance.now() - this.startedAt) / 1000;
    const fps = (this.frames / secs).toFixed(1);

    this.rec = null;
    this.chunks = [];
    this.on = false;
    resize();                 // back to the normal screen layout
    $('recBtn').classList.remove('on');
    $('recBtn').textContent = '⏺';
    $('recBadge').hidden = true;

    if (UPLOAD_PATH) {
      fetch(`${UPLOAD_PATH}?name=${encodeURIComponent(name)}&fps=${fps}`, { method: 'POST', body: blob });
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  },

  // On-screen REC badge with elapsed time.
  frame() {
    if (!this.on) return;
    this.frames++;
    const s = Math.floor((performance.now() - this.startedAt) / 1000);
    const text = `● REC ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    const badge = $('recBadge');
    if (badge.textContent !== text) badge.textContent = text;
  },
};

/* =====================================================================
   UI
   ===================================================================== */

const $ = id => document.getElementById(id);

$('recBtn').addEventListener('click', () => (Recorder.on ? Recorder.stop() : Recorder.start()));

// Tap a Pokémon to make it fire its charged attack
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (S.timeUp || S.won) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * LW;
  const y = (e.clientY - rect.top) / rect.height * LH - L.block;
  const a = active().find(o => Math.hypot(o.x - x, o.y - o.r - y) < o.r * 1.6);
  if (a) { a.energy = 0; fire(a, true); }
});

// Audio starts on load if the browser allows it. If it's blocked, any touch,
// click or key press starts it (different browsers count different events).
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  window.addEventListener(ev, () => Sound.unlock(), { capture: true });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) Sound.unlock(); });

const muteBtn = $('muteBtn');
function toggleMute() {
  Sound.setMuted(!Sound.muted);
  muteBtn.textContent = Sound.muted ? '🔇' : '🔊';
}
muteBtn.addEventListener('click', toggleMute);

const panel = $('panel');
$('setBtn').addEventListener('click', () => { panel.hidden = !panel.hidden; });
$('closeBtn').addEventListener('click', () => { panel.hidden = true; });
$('resetBtn').addEventListener('click', () => { startRound(); panel.hidden = true; });

// Bind a slider to a Settings key with a formatted readout
function bindSlider(inputId, labelId, key, fmtVal) {
  const input = $(inputId), label = $(labelId);
  input.value = Settings[key];
  label.textContent = fmtVal(Settings[key]);
  input.addEventListener('input', () => {
    Settings[key] = parseFloat(input.value);
    label.textContent = fmtVal(Settings[key]);
  });
}
bindSlider('inHp', 'vHp', 'hp', v => v.toFixed(2) + '×');
bindSlider('inPow', 'vPow', 'power', v => v.toFixed(2) + '×');

// Keyboard shortcuts for desktop recording: M = mute, R = restart the round
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === 'r' || e.key === 'R') startRound();
});

window.addEventListener('resize', resize);

/* =====================================================================
   MAIN LOOP
   ===================================================================== */

resize();
startRound();
Sound.unlock();     // try to start sound right away
if (params.has('autorecord')) Recorder.start();

let lastT = performance.now();
function frame(now) {
  // Never negative (the first rAF timestamp can be earlier than lastT), capped after tab switches
  const rdt = clamp((now - lastT) / 1000, 0, 1 / 20);
  lastT = now;
  try {
    update(rdt);
    draw();
  } catch (err) {
    console.error(err);     // log it (render.py prints these) but keep the loop alive
  }
  Recorder.frame();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
