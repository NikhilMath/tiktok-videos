<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pokémon GO Raid: Will They Beat Mewtwo in Time?</title>
<style>
  /* ---------- Page shell: black, no scrolling, stage centered ---------- */
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }

  /* The stage is sized by JS to a 9:16 (or taller) portrait box.
     --u = CSS pixels per logical unit (logical width is 540). */
  #stage { position: relative; --u: 1px; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---------- Recording indicator (on screen only, not in the video) ---------- */
  #recBadge {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--u) * 14);
    transform: translateX(-50%); padding: calc(var(--u) * 6) calc(var(--u) * 14);
    border-radius: 999px; background: rgba(230, 57, 70, 0.92); color: #fff;
    font: 800 calc(var(--u) * 14) system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.08em; pointer-events: none;
  }
  #recBadge[hidden] { display: none; }

  /* ---------- Buttons (record / mute / settings), raid style ---------- */
  #btns {
    position: absolute;
    right: calc(var(--u) * 12);
    top: calc(env(safe-area-inset-top, 0px) + var(--u) * 10);
    display: flex; gap: calc(var(--u) * 8);
  }
  .iconBtn {
    width: calc(var(--u) * 38); height: calc(var(--u) * 38);
    border-radius: 50%; border: 2px solid #F06BC8;
    background: #2A1240; color: #fff; cursor: pointer;
    font-size: calc(var(--u) * 16); line-height: 1; padding: 0;
    box-shadow: 0 0 calc(var(--u) * 10) rgba(240, 107, 200, 0.6);
  }
  #recBtn.on { background: #E63946; }

  /* ---------- Settings panel ---------- */
  #panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: calc(var(--u) * 380); padding: calc(var(--u) * 20);
    background: linear-gradient(#3A1A5C, #1E0C34); border: 2px solid #F06BC8;
    border-radius: calc(var(--u) * 20); color: #fff;
    box-shadow: 0 0 calc(var(--u) * 30) rgba(240, 107, 200, 0.5);
    font: 700 calc(var(--u) * 15) Futura, "Avenir Next", system-ui, sans-serif;
  }
  #panel[hidden] { display: none; }
  #panel h2 { margin: 0 0 calc(var(--u) * 14); font-size: calc(var(--u) * 22); text-align: center; letter-spacing: 0.12em; }
  #panel label { display: block; margin-bottom: calc(var(--u) * 14); }
  #panel label span { float: right; color: #FFD23F; }
  #panel input[type=range] { width: 100%; margin-top: calc(var(--u) * 6); accent-color: #F06BC8; }
  .row { display: flex; gap: calc(var(--u) * 10); margin-top: calc(var(--u) * 6); }
  .row button {
    flex: 1; padding: calc(var(--u) * 10); cursor: pointer; border-radius: 999px; border: none;
    font: 800 calc(var(--u) * 14) Futura, "Avenir Next", system-ui, sans-serif; letter-spacing: 0.08em;
    color: #FFFFFF; background: linear-gradient(90deg, #B03FE0, #F06BC8);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="recBadge" hidden>● REC 0:00</div>

  <div id="btns">
    <button class="iconBtn" id="recBtn" aria-label="Record a video">⏺</button>
    <button class="iconBtn" id="muteBtn" aria-label="Toggle sound">🔊</button>
    <button class="iconBtn" id="setBtn" aria-label="Settings">⚙️</button>
  </div>

  <div id="panel" hidden>
    <h2>SETTINGS</h2>
    <label>Boss HP <span id="vHp"></span>
      <input id="inHp" type="range" min="0.5" max="1.5" step="0.05">
    </label>
    <label>Boss attack power <span id="vPow"></span>
      <input id="inPow" type="range" min="0.5" max="2" step="0.05">
    </label>
    <div class="row">
      <button id="resetBtn">RESTART</button>
      <button id="closeBtn">CLOSE</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
   CONFIG
   ===================================================================== */

const TAU = Math.PI * 2;
const FONT = 'Futura, "Futura PT", "Avenir Next Condensed", "Avenir Next", "Trebuchet MS", system-ui, sans-serif';
const INK = '#1C0F2A';        // outlines (deep violet)

// Length of one round. When the clock hits 0:00 everything freezes in place.
// Here it's the raid timer: beat the boss before it runs out.
const ROUND_SECONDS = 120;   // 2:00

// Solid black bands at the top and bottom so TikTok's UI never covers the
// action: 220px on top, ~285px at the bottom of the 1920px video.
const TOP_SPACE = 110;
const BOTTOM_SPACE = 142;

// The hook: a comment prompt + question at the top for retention.
const HOOK = ['Comment below 👇', 'Will they BEAT', 'MEWTWO in time?'];

/* The raid squad: Pokémon trainers bring to a Mewtwo raid, drawn in code (see
   FACES). eff = how well their attacks hit a Psychic type (Dark, Ghost and Bug
   are super effective, Fighting is not very effective). */
const SQUAD = [
  { id: 'tyranitar', name: 'Tyranitar', eff: 1.6,   atk: 1.1,  hp: 120, alert: 0.45, charged: 'CRUNCH!',        color: '#7FB062', proj: '#5A2E7A' },
  { id: 'gengar',    name: 'Gengar',    eff: 1.6,   atk: 1.15, hp: 80,  alert: 0.6,  charged: 'SHADOW BALL!',   color: '#8E6BD0', proj: '#6A3FC4' },
  { id: 'pikachu',   name: 'Pikachu',   eff: 1.0,   atk: 0.9,  hp: 70,  alert: 0.7,  charged: 'THUNDERBOLT!',   color: '#FFD83A', proj: '#FFE34A' },
  { id: 'charizard', name: 'Charizard', eff: 1.0,   atk: 1.1,  hp: 100, alert: 0.5,  charged: 'BLAST BURN!',    color: '#FF8A3D', proj: '#FF7A2A' },
  { id: 'machamp',   name: 'Machamp',   eff: 0.625, atk: 1.2,  hp: 110, alert: 0.4,  charged: 'DYNAMIC PUNCH!', color: '#9AAFC4', proj: '#E8B07A' },
  { id: 'lucario',   name: 'Lucario',   eff: 1.0,   atk: 1.1,  hp: 90,  alert: 0.6,  charged: 'AURA SPHERE!',   color: '#4F8FD6', proj: '#6CC8FF' },
  { id: 'umbreon',   name: 'Umbreon',   eff: 1.6,   atk: 0.75, hp: 150, alert: 0.5,  charged: 'FOUL PLAY!',     color: '#4A4A5E', proj: '#3A2050' },
  { id: 'snorlax',   name: 'Snorlax',   eff: 1.0,   atk: 0.9,  hp: 170, alert: 0.2,  charged: 'HYPER BEAM!',    color: '#4E8295', proj: '#FFF2A8' },
  { id: 'dragonite', name: 'Dragonite', eff: 1.0,   atk: 1.1,  hp: 110, alert: 0.45, charged: 'OUTRAGE!',       color: '#F2A64A', proj: '#7A5AE0' },
  { id: 'garchomp',  name: 'Garchomp',  eff: 1.0,   atk: 1.15, hp: 110, alert: 0.5,  charged: 'EARTH POWER!',   color: '#4A6AB8', proj: '#B07A3A' },
  { id: 'metagross', name: 'Metagross', eff: 1.3,   atk: 1.05, hp: 120, alert: 0.35, charged: 'METEOR MASH!',   color: '#6A9BD0', proj: '#D9E6F2' },
  { id: 'scizor',    name: 'Scizor',    eff: 1.6,   atk: 0.95, hp: 100, alert: 0.55, charged: 'X-SCISSOR!',     color: '#E0454A', proj: '#8FD14F' },
];
const MEGA = { id: 'megagengar', name: 'Mega Gengar', eff: 1.6, atk: 2.4, hp: 999, alert: 1, charged: 'SHADOW BALL!', color: '#6A3FB0', proj: '#B05AF0', mega: true };

/* Where things are, in a 540×960 block (shifted down on taller phones). */
const BOSS_X = 245, BOSS_Y = 452;                       // Mewtwo's chest
const PX = 245, PY = 690, PRX = 212, PRY = 86;          // the raid platform (an ellipse)
const ARENA_TOP = TOP_SPACE + 180;

// User-tweakable settings (bound to the sliders).
const Settings = { hp: 1, power: 1 };

/* Tuning knobs, chosen by simulating many rounds in the console (README →
   "Tune the pacing by simulation"). A hidden rubber band keeps the boss's HP
   near a schedule that empties at about 0:00, then switches off for the last
   few seconds so the finish is a genuine coin flip. */
const TUNING = {
  bossHp: 36000, fastDmg: 8, chargedDmg: 70, energyGain: 14, fireGap: [0.55, 0.85],
  slots: 12, extraTrainers: 3, rejoin: 3.5,
  shadowDmg: 42, ringDmg: 26, psystrikeDmg: 95, bossGap: [2.0, 2.8], enragedGap: [1.4, 2.0],
  planEnd: 126, bandK: 3.0, bandOff: 8, recover: 0.06,
};

/* =====================================================================
   CANVAS, SIZING & LAYOUT
   ===================================================================== */

const stage = document.getElementById('stage');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const LW = 540;   // logical width; everything is laid out in these units
let LH = 960;     // logical height (grows on phones taller than 9:16)
let scale = 1;    // device pixels per logical unit
const L = {};     // layout

function layout() {
  const block = (LH - 960) / 2;
  L.block = block;
  L.cx = LW / 2;
  L.panelTop = block + TOP_SPACE;
  L.panelBottom = block + 960 - BOTTOM_SPACE;
  L.hudY = L.panelTop + 24;           // raid timer (left), trainers (right), "Comment below" (middle)
  L.title2 = L.panelTop + 66;         // hook: big lines
  L.title3 = L.panelTop + 110;
  L.barY = L.panelTop + 156;          // the boss's HP bar
}

const VIDEO_W = 1080;   // recorded video is 1080×1920 (TikTok's native size)

function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  let cssW, cssH;
  if (Recorder.on) {                  // recording: exact 9:16 frame, fitted to the window
    cssH = Math.min(wh, ww * 16 / 9); cssW = cssH * 9 / 16; LH = 960;
  } else if (wh / ww >= 16 / 9) {     // tall phone: fill the whole screen
    cssW = ww; cssH = wh; LH = LW * wh / ww;
  } else {                            // wider screen: 9:16 box, letterboxed in black
    cssH = wh; cssW = wh * 9 / 16; LH = 960;
  }
  stage.style.width = cssW + 'px';
  stage.style.height = cssH + 'px';
  stage.style.setProperty('--u', (cssW / LW) + 'px');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap for phone performance
  scale = Recorder.on ? VIDEO_W / LW : (cssW / LW) * dpr;
  canvas.width = Math.round(LW * scale);
  canvas.height = Math.round(LH * scale);
  layout();

  sprites.clear();                    // everything cached is drawn at device resolution
  buildBackdrop();
}

/* =====================================================================
   HELPERS
   ===================================================================== */

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
// Overshooting pop-in. Exactly 0 at the start: float rounding would otherwise give a
// tiny negative number, and a negative arc/gradient radius throws and stops the loop.
const easeOutBack = t => (t <= 0 ? 0 : 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2));
const blur = px => px * scale;      // shadowBlur ignores the canvas transform

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Colors: mix two #rrggbb colors (t = 0 → a, 1 → b).
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, t));
  return '#' + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
}
const lighten = (c, t) => mix(c, '#FFFFFF', t);
const darken = (c, t) => mix(c, '#000000', t);
function rgba(hex, a) { const p = parseInt(hex.slice(1), 16); return `rgba(${(p >> 16) & 255},${(p >> 8) & 255},${p & 255},${a})`; }

// Set a font that fits `text` into maxW, starting from maxSize.
function fitFont(g, text, maxW, maxSize, weight = 700, style = '') {
  let size = maxSize;
  g.font = `${style} ${weight} ${size}px ${FONT}`;
  const w = g.measureText(text).width;
  if (w > maxW) {
    size = Math.max(5, size * maxW / w);
    g.font = `${style} ${weight} ${size}px ${FONT}`;
  }
  return size;
}

function roundRect(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// Boss-fight lettering: dark outline, glow, then the fill.
function raidText(g, text, x, y, fill, glow = '#F06BC8', ow = 7) {
  g.lineJoin = 'round';
  g.save();
  g.shadowColor = glow; g.shadowBlur = blur(12);
  g.lineWidth = ow; g.strokeStyle = INK; g.strokeText(text, x, y);
  g.restore();
  g.lineWidth = ow; g.strokeStyle = INK; g.strokeText(text, x, y);
  g.fillStyle = fill; g.fillText(text, x, y);
}

function seeded(seed) {
  let s = seed;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

// Is a floor point inside the platform? (k shrinks the ellipse)
const onPlatform = (x, y, k = 1) => ((x - PX) / (PRX * k)) ** 2 + ((y - PY) / (PRY * k)) ** 2 <= 1;
const platformR = (x, y) => Math.hypot((x - PX) / PRX, (y - PY) / PRY);   // 0 = center, 1 = rim
function platformSpot(k = 0.8) {
  const a = rand(0, TAU), d = Math.sqrt(Math.random()) * k;
  return [PX + Math.cos(a) * PRX * d, PY + Math.sin(a) * PRY * d];
}
// Things further back on the platform are drawn a little smaller.
const depth = y => 0.82 + 0.18 * clamp((y - (PY - PRY)) / (2 * PRY), 0, 1);

/* =====================================================================
   SOUND (Web Audio, synthesized: a driving raid theme, hits, booms, roars)
   ===================================================================== */

// A minor, 140 bpm: A – F – G – E
const RAID_CHORDS = [
  [55, [220, 261.63, 329.63]], [43.65, [174.61, 220, 261.63]],
  [49, [196, 246.94, 293.66]], [41.2, [164.81, 207.65, 246.94]],
];
const SIXTEENTH = 60 / 140 / 4;

const Sound = {
  ctx: null, out: null, comp: null, speaker: null, recDest: null, noise: null,
  muted: false, last: {}, musicNext: 0, musicStep: 0,

  // Called on page load (starts immediately where the browser allows autoplay)
  // and again on every interaction, so audio starts the moment it's permitted.
  // Graph: sounds → out → compressor → speaker (mute switch) → speakers
  //                                  ↘ recDest (video recording, ignores mute)
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.comp = this.ctx.createDynamicsCompressor();
      this.out = this.ctx.createGain();
      this.out.gain.value = 1.2;
      this.speaker = this.ctx.createGain();
      this.speaker.gain.value = this.muted ? 0 : 1;
      this.out.connect(this.comp);
      this.comp.connect(this.speaker);
      this.speaker.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noise = this.ctx.createBuffer(1, len, len);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    // 'suspended' = blocked by autoplay rules; 'interrupted' = iOS paused it (e.g. a call)
    if (this.ctx.state !== 'running' && this.ctx.state !== 'closed') this.ctx.resume().catch(() => {});
  },

  // Audio stream for the video recorder (sound is recorded even when muted).
  recordStream() {
    if (!this.ctx || !this.ctx.createMediaStreamDestination) return null;
    if (!this.recDest) {
      this.recDest = this.ctx.createMediaStreamDestination();
      this.comp.connect(this.recDest);
    }
    return this.recDest.stream;
  },

  get running() { return !!this.ctx && this.ctx.state === 'running'; },

  setMuted(m) {
    this.muted = m;
    if (this.speaker) this.speaker.gain.setTargetAtTime(m ? 0 : 1, this.ctx.currentTime, 0.02);
  },

  get ready() { return this.running && (!this.muted || Recorder.on); },

  // Rate limit: true if this sound played less than `gap` seconds ago.
  busy(key, gap) {
    const now = this.ctx.currentTime;
    if (now - (this.last[key] || 0) < gap) return true;
    this.last[key] = now;
    return false;
  },

  note(freq, when, dur, type = 'sine', vol = 0.2, freqTo = 0) {
    const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqTo) o.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur + 0.05);
  },

  // Filtered noise. attack > 0 fades in, otherwise it hits instantly.
  burst(dur, freq, q, vol, freqTo = 0, when = 0, attack = 0, type = 'bandpass') {
    const c = this.ctx, t = c.currentTime + when;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noise;
    src.loop = dur > 0.9;
    f.type = type;
    f.frequency.setValueAtTime(freq, t);
    if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
    f.Q.value = q;
    if (attack > 0) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
    } else {
      g.gain.setValueAtTime(vol, t);
    }
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.out);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  },

  // Brassy stab: detuned sawtooths through a low-pass filter.
  brass(freqs, when, dur, vol = 0.03) {
    const c = this.ctx, t = c.currentTime + when;
    const f = c.createBiquadFilter(), g = c.createGain();
    f.type = 'lowpass'; f.Q.value = 1;
    f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(2600, t + 0.08); f.frequency.exponentialRampToValueAtTime(900, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.connect(g); g.connect(this.out);
    for (const fr of freqs) for (const det of [-6, 6]) {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);
    }
  },

  // Background: a driving raid theme. Pumping bass, timpani booms, snare,
  // brass stabs every bar; hi-hats join in the last 30 seconds.
  music() {
    if (!this.ready) { this.musicNext = 0; return; }
    const now = this.ctx.currentTime;
    if (this.musicNext < now) this.musicNext = now + 0.05;
    while (this.musicNext < now + 0.15) {
      const k = this.musicStep++, bar = RAID_CHORDS[Math.floor(k / 16) % RAID_CHORDS.length], e = k % 16;
      const when = this.musicNext - now;
      if (e % 2 === 0) this.note(e % 4 === 0 ? bar[0] : bar[0] * 2, when, 0.12, 'sawtooth', 0.05);
      if (e === 0 || e === 8) this.note(80, when, 0.35, 'sine', 0.42, 42);                       // timpani
      if (e === 4 || e === 12) this.burst(0.14, 1800, 0.7, 0.13, 0, when);                       // snare
      if (e === 0) this.brass(bar[1], when, 0.5, 0.022);
      if (e === 10) this.brass(bar[1].map(f => f * 2), when, 0.18, 0.012);
      if (S.clock < 30 && e % 2 === 1) this.burst(0.03, 9000, 1, 0.03, 0, when, 0, 'highpass');
      this.musicNext += SIXTEENTH;
    }
  },

  fast() {
    if (!this.ready || this.busy('fast', 0.05)) return;
    this.note(rand(500, 900), 0, 0.06, 'square', 0.025, 200);
    this.burst(0.05, 2500, 1.5, 0.05);
  },
  charged(eff) {
    if (!this.ready || this.busy('charged', 0.08)) return;
    this.burst(0.35, 1400, 0.7, 0.3, 200);
    this.note(110, 0, 0.3, 'sine', 0.4, 50);
    if (eff > 1) [1568, 2093].forEach((f, i) => this.note(f, 0.05 + i * 0.06, 0.25, 'triangle', 0.07));
  },
  bossCast() {
    if (!this.ready) return;
    this.note(160, 0, 0.6, 'sawtooth', 0.06, 90);
    this.burst(0.6, 800, 2, 0.12, 2400, 0, 0.3);
  },
  shadowHit() {
    if (!this.ready || this.busy('shadowHit', 0.06)) return;
    this.note(90, 0, 0.35, 'sine', 0.35, 40);
    this.burst(0.3, 600, 0.8, 0.25, 150);
  },
  ring() {
    if (!this.ready) return;
    this.note(220, 0, 1.0, 'sine', 0.12, 110);
    this.burst(1.0, 300, 1, 0.15, 2000, 0, 0.1);
  },
  psystrike() {
    if (!this.ready) return;
    this.burst(1.0, 200, 0.6, 0.5, 60);
    this.note(55, 0, 1.0, 'sine', 0.6, 30);
    [880, 1318.5, 1760].forEach((f, i) => this.note(f, i * 0.04, 0.6, 'sine', 0.05, f * 0.5));
  },
  warn() {
    if (!this.ready || this.busy('warn', 0.2)) return;
    this.note(880, 0, 0.12, 'square', 0.04); this.note(880, 0.16, 0.12, 'square', 0.04);
  },
  faint() {
    if (!this.ready || this.busy('faint', 0.1)) return;
    this.note(600, 0, 0.4, 'square', 0.04, 120);
  },
  join() {
    if (!this.ready || this.busy('join', 0.1)) return;
    this.note(400, 0, 0.2, 'sine', 0.08, 1200);
    this.burst(0.2, 3000, 1, 0.06, 6000);
  },
  roar() {
    if (!this.ready) return;
    this.burst(1.6, 400, 0.5, 0.45, 120, 0, 0.15, 'lowpass');
    this.note(110, 0, 1.4, 'sawtooth', 0.12, 70);
    this.note(165, 0, 1.4, 'sawtooth', 0.06, 100);
  },
  barrier() {
    if (!this.ready) return;
    [2093, 2637, 3136, 2637].forEach((f, i) => this.note(f, i * 0.05, 0.6, 'sine', 0.05));
    this.burst(0.5, 5000, 2, 0.1, 8000);
  },
  heal() {
    if (!this.ready) return;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => this.note(f, i * 0.08, 0.5, 'triangle', 0.05));
  },
  teleport() {
    if (!this.ready) return;
    this.note(300, 0, 0.3, 'sine', 0.1, 2400);
    this.note(2400, 0.35, 0.3, 'sine', 0.08, 300);
  },
  // Good news for the raiders: a bright brass fanfare.
  boost() {
    if (!this.ready) return;
    this.brass([523.25, 659.25, 783.99], 0, 0.25, 0.04);
    this.brass([587.33, 739.99, 880], 0.18, 0.5, 0.04);
  },
  // Bad news: a low, dark hit.
  threat() {
    if (!this.ready) return;
    this.brass([110, 130.81, 155.56], 0, 0.9, 0.05);
    this.note(55, 0, 1, 'sine', 0.4, 35);
  },
  tick() {
    if (!this.ready) return;
    this.note(1250, 0, 0.06, 'triangle', 0.15);
    this.burst(0.04, 2400, 6, 0.2);
  },
  win() {
    if (!this.ready) return;
    this.burst(1.0, 300, 0.6, 0.5, 60);
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.brass([f, f * 1.25], 0.3 + i * 0.12, 0.35, 0.04));
    this.brass([523.25, 659.25, 783.99, 1046.5], 0.8, 2.2, 0.05);
    this.burst(1.4, 6000, 0.7, 0.12, 2500, 0.8);
  },
  fail() {
    if (!this.ready) return;
    this.roar();
    [[392, 0.6], [369.99, 0.9], [349.23, 1.2], [329.63, 1.5]].forEach(([f, w]) => this.brass([f / 2, f * 0.6], w, 0.5, 0.04));
  },
};

/* =====================================================================
   SIMULATION STATE
   ===================================================================== */

const S = {
  boss: null, squad: [], slots: [], shots: [], hazards: [], fx: [],
  boosts: [], banner: null, flash: 0, shake: 0, bolt: 0,
  events: [], nextEvent: 0, lastSide: 'boss', raiderDeck: [], bossDeck: [], finalDone: false,
  won: false, wonAt: 0, bestCombo: 0,
  clock: ROUND_SECONDS, lastTick: 0, timeUp: false,
  time: 0, roundT: 0,
};

function makeAttacker(def, slot) {
  const [x, y] = platformSpot(def.mega ? 0.3 : 0.75);
  return { def, slot, x, y: def.mega ? PY + 40 : y, tx: x, ty: y, hp: def.hp, maxHp: def.hp,
           energy: rand(0, 70), fireT: rand(0.2, 0.9), hop: 0, hopV: 0, sprintT: 0, wanderT: rand(0.5, 2),
           state: 'drop', dropT: 0, faintT: 0, hurtT: 0, face: x < BOSS_X ? 1 : -1, r: def.mega ? 30 : 19,
           life: def.mega ? 15 : 0, rings: new Set() };
}

const active = () => S.squad.filter(a => a.state === 'in');
const hpFrac = () => Math.max(0, S.boss.hp) / S.boss.maxHp;

// Fresh round: Mewtwo at full HP, 12 trainers' Pokémon on the platform.
function startRound() {
  const hp = TUNING.bossHp * Settings.hp;
  S.boss = { hp, maxHp: hp, x: BOSS_X, y: BOSS_Y, hurtT: 0, barrierT: 0, healT: 0, healLeft: 0, enraged: false,
             attackT: 2.4, castT: 0, tpT: 0, tpFrom: BOSS_X, tpTo: BOSS_X, defeatT: 0, introT: 0 };
  S.squad = []; S.shots = []; S.hazards = []; S.fx = []; S.boosts = [];
  S.slots = [];
  const cast = shuffle(SQUAD.slice());
  for (let i = 0; i < TUNING.slots; i++) addSlot(cast[i % cast.length], true);
  S.banner = null; S.flash = 0; S.shake = 0; S.bolt = 0;
  S.won = false; S.wonAt = 0; S.finalDone = false;
  S.raiderDeck = shuffle(['trainers', 'mega', 'revive', 'friends', 'fog', 'razz']);
  S.bossDeck = shuffle(['barrier', 'recover', 'psystorm', 'teleport', 'shadowstorm']);
  S.lastSide = 'boss';
  S.clock = Number(params.get('seconds')) || ROUND_SECONDS;   // ?seconds=10 for quick tests
  S.lastTick = 0;
  S.timeUp = false;
  S.roundT = 0;
  S.nextEvent = 8;
  showBanner('RAID BATTLE!', 'MEWTWO appeared!', '#F06BC8', 2.2);
  Sound.roar();
}

function addSlot(def, instant = false) {
  const slot = { id: S.slots.length, rejoinT: 0 };
  S.slots.push(slot);
  const a = makeAttacker(def, slot);
  if (instant) { a.state = 'in'; a.dropT = 1; }
  S.squad.push(a);
  return a;
}

/* =====================================================================
   THE RAID: attackers fire at the boss; the boss fires back
   ===================================================================== */

// Raid-wide damage bonus: Mega boost, friendship, a hidden rubber band, …
function boostMult(a) {
  let m = 1;
  for (const b of S.boosts) if (b.t > 0 && (!b.only || b.only.includes(a.def.id))) m *= b.mult;
  return m * bandMult();
}
// Positive = the boss has more HP left than the schedule wants.
function behind() {
  const plan = clamp(1 - S.roundT / TUNING.planEnd, 0, 1);
  return hpFrac() - plan;
}
// The rubber band fades out for the last few seconds.
function bandMult() {
  const fade = clamp((S.clock - TUNING.bandOff) / 10, 0, 1);
  return clamp(1 + TUNING.bandK * behind() * fade, 0.5, 1.6);
}

function fire(a, charged) {
  const tx = S.boss.x + rand(-34, 34), ty = S.boss.y + rand(-50, 50);
  const hx = a.x, hy = a.y - a.r * depth(a.y) - a.hop;
  const dmg = (charged ? TUNING.chargedDmg : TUNING.fastDmg) * a.def.atk * a.def.eff * boostMult(a);
  S.shots.push({ x0: hx, y0: hy, x1: tx, y1: ty, t: 0, dur: charged ? 0.45 : rand(0.28, 0.4), big: charged, dmg, a,
                 color: a.def.proj, arc: rand(-40, 40) - (charged ? 60 : 30) });
  if (charged) {
    addFloat(a.x, a.y - 52, a.def.charged, lighten(a.def.color, 0.3), 15, 1.0);
    S.flash = Math.max(S.flash, 0.05);
  } else Sound.fast();
}

function hitBoss(sh) {
  const B = S.boss;
  if (S.won || S.timeUp) return;
  if (B.tpT > 0 && B.tpT < 0.8) { if (sh.big) addFloat(sh.x1, sh.y1 - 10, 'MISS!', '#FFFFFF', 14, 0.6); return; }
  let dmg = sh.dmg;
  if (B.barrierT > 0) dmg *= 0.25;
  B.hp -= dmg;
  if (sh.big) B.hurtT = 0.12;
  addSparks(sh.x1, sh.y1, sh.big ? 16 : 4, [sh.color, '#FFFFFF', lighten(sh.color, 0.5)], sh.big ? 320 : 160);
  if (sh.big) {
    addRing(sh.x1, sh.y1, 6, 46, sh.color, 0.4, 6);
    addFloat(sh.x1 + rand(-30, 30), sh.y1 - 20, `-${Math.round(dmg)}`, B.barrierT > 0 ? '#9FE3FF' : '#FFFFFF', 18, 0.8);
    if (sh.a.def.eff > 1 && B.barrierT <= 0) addFloat(sh.x1, sh.y1 - 44, 'SUPER EFFECTIVE!', '#FFD23F', 14, 0.9);
    if (sh.a.def.eff < 1) addFloat(sh.x1, sh.y1 - 44, 'Not very effective…', '#B9B0C9', 12, 0.9);
    S.shake = Math.max(S.shake, 3);
    Sound.charged(sh.a.def.eff);
  }
  if (B.hp <= 0) defeatBoss();
}

// Mewtwo's attacks: Shadow Balls at a few attackers, a psychic ring across the
// whole platform (jump over it!), or Psystrike on the biggest crowd.
function bossAttack() {
  const B = S.boss;
  const list = active();
  if (!list.length) return;
  const r = Math.random();
  B.castT = 0.6;
  if (r < 0.48) {
    const n = (B.enraged ? 4 : 3) + (Math.random() < 0.3 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const t = pick(list);
      const hand = i % 2 ? 1 : -1;
      newHazard({ kind: 'shadow', sx: B.x + hand * 62, sy: B.y + 28, x: t.x + rand(-8, 8), y: t.y + rand(-5, 5), r: 30, t: -i * 0.18, dur: 1.0, dmg: TUNING.shadowDmg });
    }
    Sound.bossCast();
  } else if (r < 0.8) {
    newHazard({ kind: 'ring', x: PX, y: PY, t: 0, dur: 1.4, dmg: TUNING.ringDmg });
    Sound.ring();
  } else {
    let best = list[0], bestN = -1;
    for (const a of list) { const n = list.filter(o => Math.hypot((o.x - a.x), (o.y - a.y) * 2) < 80).length; if (n > bestN) { bestN = n; best = a; } }
    psystrike(best.x, best.y);
  }
}
function psystrike(x, y, r = 72) {
  newHazard({ kind: 'psystrike', x, y, r, t: 0, dur: 1.25, dmg: TUNING.psystrikeDmg });
  addFloat(S.boss.x, S.boss.y - 120, 'PSYSTRIKE!', '#FF8AD8', 20, 1.2);
  Sound.bossCast(); Sound.warn();
}

// A new boss attack: Pokémon standing where it'll land may notice and get out of the way.
function newHazard(h) {
  h.done = false;
  h.id = ++hazardId;
  S.hazards.push(h);
  if (h.kind === 'ring') return;
  for (const a of active()) {
    const inside = Math.hypot(a.x - h.x, (a.y - h.y) * 2.2) < h.r + 6;
    if (!inside || Math.random() > a.def.alert) continue;
    let dx = a.x - h.x, dy = (a.y - h.y) * 2.2;
    if (Math.hypot(dx, dy) < 1) { dx = rand(-1, 1); dy = rand(-1, 1); }
    const d = Math.hypot(dx, dy);
    let tx = h.x + dx / d * (h.r + 26), ty = h.y + dy / d * (h.r + 26) / 2.2;
    if (!onPlatform(tx, ty, 0.88)) { tx = h.x - dx / d * (h.r + 26); ty = h.y - dy / d * (h.r + 26) / 2.2; }
    if (onPlatform(tx, ty, 0.92)) { a.tx = tx; a.ty = ty; a.sprintT = 0.9; }
  }
}

function hurt(a, dmg) {
  if (a.def.mega) dmg *= 0.2;
  a.hp -= dmg * Settings.power * (S.boss.enraged ? 1.25 : 1);
  a.hurtT = 0.25;
  addSparks(a.x, a.y - a.r, 6, ['#FF8AD8', '#FFFFFF'], 150);
  if (a.hp <= 0 && a.state === 'in') {
    a.state = 'faint'; a.faintT = 0;
    addFloat(a.x, a.y - 44, 'FAINTED', '#B9B0C9', 13, 0.8);
    a.slot.rejoinT = TUNING.rejoin;
    Sound.faint();
  }
}

function updateHazards(rdt) {
  for (const h of S.hazards) {
    h.t += rdt;
    if (h.t < 0 || h.done) continue;
    if (h.kind === 'ring') {
      const R = h.t / h.dur * 1.1;
      for (const a of active()) {
        const pr = platformR(a.x, a.y);
        if (!a.rings.has(h) && R > pr - 0.16 && R < pr) {        // about to pass under them: jump?
          a.rings.add(h);
          if (Math.random() < a.def.alert && a.hop <= 0) a.hopV = 300;
        }
        if (!a.rings.has('hit' + h.id) && Math.abs(R - pr) < 0.05) {
          a.rings.add('hit' + h.id);
          if (a.hop < 8) hurt(a, h.dmg);
        }
      }
      if (h.t >= h.dur) h.done = true;
    } else if (h.t >= h.dur) {
      h.done = true;
      for (const a of active()) if (Math.hypot(a.x - h.x, (a.y - h.y) * 2.2) < h.r && a.hop < 20) hurt(a, h.dmg);
      if (h.kind === 'shadow') {
        addRing(h.x, h.y, 4, h.r + 14, '#8E4FE0', 0.4, 6);
        addSparks(h.x, h.y, 12, ['#5A2E9A', '#B07AF0', '#1C0F2A'], 240);
        Sound.shadowHit();
      } else {
        addRing(h.x, h.y, 10, h.r + 40, '#FF8AD8', 0.6, 10);
        addSparks(h.x, h.y, 30, ['#FF8AD8', '#FFFFFF', '#C04FE0'], 380);
        S.shake = Math.max(S.shake, 10); S.flash = Math.max(S.flash, 0.25);
        Sound.psystrike();
      }
    }
  }
  S.hazards = S.hazards.filter(h => !h.done || h.t < h.dur + 0.3);
}

let hazardId = 0;

function updateSquad(rdt) {
  for (const a of S.squad) {
    a.hurtT -= rdt;
    if (a.state === 'drop') {                          // dropping in from the sky
      a.dropT += rdt * 2;
      if (a.dropT >= 1) { a.state = 'in'; addRing(a.x, a.y, 4, 30, a.def.color, 0.4, 4); }
      continue;
    }
    if (a.state === 'faint') { a.faintT += rdt; continue; }
    if (a.state !== 'in') continue;
    // hop physics
    if (a.hop > 0 || a.hopV > 0) { a.hop += a.hopV * rdt; a.hopV -= 900 * rdt; if (a.hop <= 0) { a.hop = 0; a.hopV = 0; } }
    // move toward the target spot
    a.sprintT -= rdt; a.wanderT -= rdt;
    if (a.wanderT <= 0 && a.sprintT <= 0) { a.wanderT = rand(1.5, 3.5); [a.tx, a.ty] = platformSpot(a.def.mega ? 0.3 : 0.8); }
    const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
    const sp = a.sprintT > 0 ? 190 : 55;
    if (d > 2) { a.x += dx / d * Math.min(d, sp * rdt); a.y += dy / d * Math.min(d, sp * rdt) * 0.6; }
    a.face = S.boss.x > a.x ? 1 : -1;
    // attack
    if (S.won) { if (a.hop <= 0 && Math.random() < rdt * 1.5) a.hopV = 280; continue; }
    a.fireT -= rdt;
    if (a.fireT <= 0) {
      a.fireT = rand(TUNING.fireGap[0], TUNING.fireGap[1]) * (a.def.mega ? 0.6 : 1);
      a.energy += TUNING.energyGain;
      if (a.energy >= 100) { a.energy = 0; fire(a, true); } else fire(a, false);
    }
    if (a.def.mega && (a.life -= rdt) <= 0) {
      a.state = 'gone';
      addSparks(a.x, a.y - a.r, 20, ['#B05AF0', '#FFFFFF'], 260);
      addFloat(a.x, a.y - 50, 'Mega Evolution ended', '#D9C2F5', 13, 1.0);
    }
  }
  // fainted Pokémon disappear; their trainer sends in the next one
  S.squad = S.squad.filter(a => !(a.state === 'faint' && a.faintT > 0.6) && a.state !== 'gone');
  for (const slot of S.slots) {
    if (S.squad.some(a => a.slot === slot)) continue;
    slot.rejoinT -= rdt;
    if (slot.rejoinT <= 0 && !S.won) {
      const a = makeAttacker(pick(SQUAD), slot);
      S.squad.push(a);
      Sound.join();
    }
  }
}

function updateShots(rdt) {
  for (const sh of S.shots) {
    sh.t += rdt;
    if (sh.t >= sh.dur && !sh.done) { sh.done = true; hitBoss(sh); }
  }
  S.shots = S.shots.filter(sh => !sh.done);
}

function updateBoss(rdt) {
  const B = S.boss;
  B.hurtT -= rdt; B.castT -= rdt; B.barrierT -= rdt; B.introT += rdt;
  if (B.tpT > 0) {                                     // teleporting: vanish, reappear elsewhere
    B.tpT -= rdt;
    if (B.tpT < 0.5 && B.x !== B.tpTo) { B.x = B.tpTo; addSparks(B.x, B.y, 20, ['#FF8AD8', '#FFFFFF'], 260); }
  } else if (!S.won) {
    B.x = lerp(B.x, BOSS_X, 1 - Math.exp(-rdt * 0.4));
  }
  if (B.healLeft > 0) {                                // Recover: heals over a second and a half
    const h = Math.min(B.healLeft, B.maxHp * TUNING.recover / 1.5 * rdt);
    B.hp = Math.min(B.maxHp, B.hp + h); B.healLeft -= h;
    if (Math.random() < rdt * 20) S.fx.push({ kind: 'plus', x: B.x + rand(-60, 60), y: B.y + rand(-60, 80), vy: -60, life: 0.8, max: 0.8 });
  }
  if (!B.enraged && hpFrac() < 0.3 && !S.won) {
    B.enraged = true;
    showBanner('MEWTWO IS ENRAGED!', 'Its attacks are faster and stronger', '#FF3B5C');
    Sound.roar();
    S.shake = 10;
  }
  if (S.won) { B.defeatT += rdt; return; }
  B.attackT -= rdt;
  if (B.attackT <= 0 && B.tpT <= 0) {
    const gap = B.enraged ? TUNING.enragedGap : TUNING.bossGap;
    B.attackT = rand(gap[0], gap[1]);
    bossAttack();
  }
}

function defeatBoss() {
  S.won = true;
  S.wonAt = S.clock;
  S.boss.hp = 0;
  S.boss.defeatT = 0;
  S.hazards = [];
  showBanner('RAID WON!', `Mewtwo was defeated with ${secsText(S.clock)} left!`, '#FFD23F', 999);
  S.flash = 0.6; S.shake = 14;
  addConfetti(90);
  for (let i = 0; i < 3; i++) addRing(S.boss.x, S.boss.y, 20, 160 + i * 40, i ? '#FFFFFF' : '#FFD23F', 0.8 + i * 0.2, 10);
  Sound.win();
}

/* =====================================================================
   EVENTS: something new about every 9 seconds. When the raid is behind
   schedule the trainers get help; when it's ahead, Mewtwo fights back.
   ===================================================================== */

function showBanner(text, sub, color, life = 2.4) {
  S.banner = { text, sub, color, life, max: life };
}

function runEvent() {
  const b = behind();
  let side = b > 0.04 ? 'raiders' : b < -0.04 ? 'boss' : (S.lastSide === 'boss' ? 'raiders' : 'boss');
  if (!S.raiderDeck.length) S.raiderDeck = shuffle(['trainers', 'mega', 'revive', 'friends', 'fog', 'razz']);
  if (!S.bossDeck.length) S.bossDeck = shuffle(['barrier', 'recover', 'psystorm', 'teleport', 'shadowstorm']);
  S.lastSide = side;
  const kind = side === 'raiders' ? S.raiderDeck.shift() : S.bossDeck.shift();
  if (!kind) return;
  const B = S.boss;
  switch (kind) {
    case 'trainers': {
      for (let i = 0; i < TUNING.extraTrainers; i++) { const a = addSlot(pick(SQUAD)); a.dropT = -i * 0.3; }
      showBanner(`+${TUNING.extraTrainers} TRAINERS JOINED!`, `${S.slots.length} trainers in the raid`, '#5FE07A');
      Sound.boost();
      break;
    }
    case 'mega': {
      const a = addSlot(MEGA); a.slot.mega = true;
      S.boosts.push({ name: 'MEGA', mult: 1.25, t: 15 });
      showBanner('MEGA GENGAR!', 'Mega boost: everyone hits 25% harder', '#B05AF0');
      Sound.boost(); S.flash = 0.3;
      break;
    }
    case 'revive': {
      for (const slot of S.slots) slot.rejoinT = 0;
      for (const a of S.squad) if (a.state === 'in') a.hp = a.maxHp;
      showBanner('MAX REVIVE!', 'Every Pokémon is back at full HP', '#FFD23F');
      Sound.heal();
      break;
    }
    case 'friends':
      S.boosts.push({ name: 'BEST FRIENDS', mult: 1.15, t: 14 });
      showBanner('BEST FRIENDS BONUS!', 'Damage +15% for 14 seconds', '#FF7AB8');
      for (let i = 0; i < 14; i++) S.fx.push({ kind: 'heart', x: PX + rand(-180, 180), y: PY + rand(-50, 40), vy: -rand(40, 80), life: 1.6, max: 1.6 });
      Sound.boost();
      break;
    case 'fog':
      S.boosts.push({ name: 'FOG', mult: 1.3, t: 14, only: ['tyranitar', 'gengar', 'umbreon', 'megagengar'] });
      showBanner('WEATHER: FOG!', 'Dark and Ghost attacks boosted', '#9AA4C8');
      S.fogT = 14;
      Sound.boost();
      break;
    case 'razz':
      for (const a of active()) a.energy = 100;
      for (const a of active()) a.fireT = rand(0, 0.5);
      showBanner('GOLDEN RAZZ BERRIES!', 'Every Pokémon fires its charged attack!', '#FFD23F');
      Sound.boost();
      break;
    case 'barrier':
      B.barrierT = 5;
      showBanner('MEWTWO USED BARRIER!', 'Damage cut to a quarter for 5 seconds', '#9FE3FF');
      Sound.barrier();
      break;
    case 'recover':
      B.healLeft = B.maxHp * TUNING.recover;
      showBanner('MEWTWO USED RECOVER!', `It heals ${Math.round(TUNING.recover * 100)}% of its HP`, '#5FE07A');
      Sound.heal();
      break;
    case 'psystorm': {
      const list = active();
      showBanner('PSYSTRIKE STORM!', 'Three blasts at once', '#FF3B8A');
      for (let i = 0; i < 3; i++) { const t = list.length ? pick(list) : null; if (t) psystrike(t.x, t.y, 62); }
      Sound.threat();
      break;
    }
    case 'teleport':
      B.tpT = 1.1; B.tpFrom = B.x; B.tpTo = clamp(B.x + (Math.random() < 0.5 ? -1 : 1) * rand(60, 95), 150, 340);
      showBanner('MEWTWO TELEPORTED!', 'Attacks in the air miss', '#C9A3FF');
      Sound.teleport();
      break;
    case 'shadowstorm': {
      const list = active();
      for (let i = 0; i < 8 && list.length; i++) {
        const t = pick(list);
        newHazard({ kind: 'shadow', sx: B.x + (i % 2 ? 62 : -62), sy: B.y + 28, x: t.x + rand(-10, 10), y: t.y + rand(-6, 6), r: 30, t: -i * 0.15, dur: 1.0, dmg: TUNING.shadowDmg });
      }
      showBanner('SHADOW BALL STORM!', 'Mewtwo throws eight at once', '#8E4FE0');
      Sound.threat();
      break;
    }
  }
}

function finalPush() {
  S.finalDone = true;
  for (const a of active()) { a.energy = 100; a.fireT = rand(0, 0.6); }
  showBanner('FINAL 10 SECONDS!', 'All-out attack!', '#FF6A3D');
  Sound.boost();
}

/* =====================================================================
   EFFECTS
   ===================================================================== */

function addRing(x, y, r0, r1, color, life, width) {
  S.fx.push({ kind: 'ring', x, y, r0, r1, color, life, max: life, width });
}
function addSparks(x, y, count, colors, speed) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU), s = rand(speed * 0.3, speed), life = rand(0.35, 0.8);
    S.fx.push({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                color: pick(colors), size: rand(1.6, 3.4), life, max: life });
  }
}
function addConfetti(count) {
  const colors = ['#FFD23F', '#F06BC8', '#6CC8FF', '#7CE38B', '#FFFFFF', '#B05AF0'];
  for (let i = 0; i < count; i++) {
    const life = rand(1.8, 3.2);
    S.fx.push({ kind: 'confetti', x: rand(20, 470), y: rand(ARENA_TOP - 60, ARENA_TOP + 40), vx: rand(-60, 60), vy: rand(40, 160),
                spin: rand(-8, 8), a: rand(0, TAU), color: pick(colors), size: rand(4, 7), life, max: life });
  }
}
// Floating text; stacks above any recent text at the same spot instead of overlapping it.
function addFloat(x, y, text, color, size, life) {
  for (let k = 0; k < 4; k++) {
    const clash = S.fx.some(f => f.kind === 'float' && f.max - f.life < 0.5 && Math.abs(f.x - x) < 110 && Math.abs(f.y - y) < 18);
    if (!clash) break;
    y -= 20;
  }
  S.fx.push({ kind: 'float', x, y, text, color, size, life, max: life });
}

/* =====================================================================
   UPDATE
   ===================================================================== */

function update(rdt) {
  S.time += rdt;

  // Real-time timers
  S.flash = Math.max(0, S.flash - rdt * 2.2);
  S.shake = Math.max(0, S.shake - rdt * 30);
  if (S.banner && (S.banner.life -= rdt) <= 0) S.banner = null;
  if (S.bolt > 0) S.bolt -= rdt;
  else if (Math.random() < rdt * 0.25) S.bolt = 0.18;          // lightning in the storm

  for (const f of S.fx) {
    f.life -= rdt;
    if (f.kind === 'spark') {
      f.x += f.vx * rdt; f.y += f.vy * rdt;
      f.vx *= 0.92; f.vy *= 0.92;
    } else if (f.kind === 'confetti') {
      f.vy = Math.min(f.vy + 120 * rdt, 170);
      f.x += (f.vx + Math.sin(S.time * 3 + f.spin) * 30) * rdt; f.y += f.vy * rdt;
      f.a += f.spin * rdt;
    } else if (f.kind === 'plus' || f.kind === 'heart') {
      f.y += f.vy * rdt;
    }
  }
  S.fx = S.fx.filter(f => f.life > 0);

  // Round clock (wall-clock time, so the video is exactly 2:00)
  if (!S.timeUp) {
    S.clock -= rdt;
    const whole = Math.ceil(S.clock);
    if (whole !== S.lastTick && whole <= 5 && whole > 0) Sound.tick();
    S.lastTick = whole;
    if (S.clock <= 0) endRound();
    else Sound.music();
  }
  if (S.timeUp) { Recorder.tick(rdt); return; }   // frozen: nothing moves
  S.roundT += rdt;

  for (const b of S.boosts) b.t -= rdt;
  S.boosts = S.boosts.filter(b => b.t > 0);
  if (!S.won && S.roundT >= S.nextEvent && S.clock > 14) {
    runEvent();
    S.nextEvent = S.roundT + rand(8.6, 10);
  }
  if (!S.won && !S.finalDone && S.clock <= 10) finalPush();

  updateBoss(rdt);
  updateSquad(rdt);
  updateShots(rdt);
  updateHazards(rdt);
}

const secsText = t => { const n = Math.max(1, Math.ceil(t)); return n === 1 ? '1 second' : `${n} seconds`; };

function endRound() {
  S.clock = 0;
  S.timeUp = true;
  if (S.won) {
    S.banner = { final: true, won: true, text: 'RAID WON!', sub: `with ${secsText(S.wonAt)} to spare`, color: '#FFD23F', life: 999, max: 999 };
    S.flash = 0.3;
  } else {
    const p = hpFrac() * 100;
    const pct = p < 1 ? p.toFixed(1) : String(Math.ceil(p));
    S.banner = { final: true, won: false, text: 'RAID FAILED!', sub: `Mewtwo still had ${pct}% HP left…`, color: '#FF3B5C', life: 999, max: 999 };
    S.flash = 0.25;
    Sound.fail();
  }
}

/* =====================================================================
   CHARACTERS: every Pokémon is drawn in code (no image files). Squad faces
   are drawn in "unit space" (head = circle of radius 1 at 0,0); Mewtwo is a
   full figure drawn in logical units.
   ===================================================================== */

function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, TAU); }
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); }
function ink(g, fill, w = 0.07) {
  g.fillStyle = fill;
  g.fill();
  g.lineWidth = w;
  g.strokeStyle = INK;
  g.stroke();
}
function seg(g, x1, y1, x2, y2, w, color = INK) {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
  g.lineWidth = w; g.lineCap = 'round'; g.strokeStyle = color; g.stroke();
}
function dot(g, x, y, r, color = INK) { circ(g, x, y, r); g.fillStyle = color; g.fill(); }
function beady(g, x, y, r) { dot(g, x, y, r); dot(g, x - r * 0.35, y - r * 0.35, r * 0.38, '#FFFFFF'); }
function bigEye(g, x, y, rx, ry, iris) {
  ell(g, x, y, rx, ry); ink(g, '#FFFFFF', 0.05);
  ell(g, x + rx * 0.12, y + ry * 0.18, rx * 0.68, ry * 0.72); g.fillStyle = iris; g.fill();
  dot(g, x + rx * 0.12, y + ry * 0.25, rx * 0.36, '#111111');
  dot(g, x - rx * 0.12, y - ry * 0.25, rx * 0.26, '#FFFFFF');
}
// Narrow, fierce eye with a brow cut (s = side, -1 left / 1 right).
function fierceEye(g, s, x, y, iris) {
  g.save();
  ell(g, s * x, y, 0.2, 0.14, s * 0.25); g.clip();
  g.fillStyle = '#FFFFFF'; g.fillRect(s * x - 0.3, y - 0.3, 0.6, 0.6);
  dot(g, s * (x - 0.03), y + 0.02, 0.09, iris);
  dot(g, s * (x - 0.03), y + 0.02, 0.045, '#111111');
  g.restore();
  ell(g, s * x, y, 0.2, 0.14, s * 0.25); g.lineWidth = 0.05; g.strokeStyle = INK; g.stroke();
  seg(g, s * (x - 0.22), y - 0.12, s * (x + 0.2), y - 0.26, 0.08);
}
function ballBase(g, light, dark) {
  const gr = g.createRadialGradient(-0.35, -0.42, 0.05, 0, 0, 1.05);
  gr.addColorStop(0, light);
  gr.addColorStop(1, dark);
  circ(g, 0, 0, 1); g.fillStyle = gr; g.fill();
}
function inside(g, fn) { g.save(); circ(g, 0, 0, 0.995); g.clip(); fn(); g.restore(); }
// Outline + a pink raid-light rim.
function ballDone(g) {
  const gr = g.createRadialGradient(-0.42, -0.5, 0, -0.42, -0.5, 0.62);
  gr.addColorStop(0, 'rgba(255,255,255,0.38)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  circ(g, 0, 0, 1); g.fillStyle = gr; g.fill();
  g.save(); circ(g, 0, 0, 1); g.clip();
  g.lineWidth = 0.22; g.strokeStyle = 'rgba(255,120,220,0.28)'; circ(g, 0.12, 0.1, 1); g.stroke();
  g.restore();
  circ(g, 0, 0, 1); g.lineWidth = 0.08; g.strokeStyle = INK; g.stroke();
}
function smile(g, x0, x1, y, depth, w = 0.08) {
  g.beginPath(); g.moveTo(x0, y); g.quadraticCurveTo((x0 + x1) / 2, y + depth, x1, y);
  g.lineWidth = w; g.lineCap = 'round'; g.strokeStyle = INK; g.stroke();
}
function openMouth(g, x0, x1, y, depth, color = '#8E2430') {
  g.beginPath(); g.moveTo(x0, y); g.quadraticCurveTo((x0 + x1) / 2, y + depth, x1, y);
  g.quadraticCurveTo((x0 + x1) / 2, y + depth * 0.3, x0, y); g.closePath(); ink(g, color, 0.05);
}
function fangs(g, x0, x1, y, n, len) {
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const a = lerp(x0, x1, i / n), b = lerp(x0, x1, (i + 1) / n);
    g.moveTo(a, y); g.lineTo((a + b) / 2, y + len); g.lineTo(b, y);
  }
  g.fillStyle = '#FFFFFF'; g.fill(); g.lineWidth = 0.03; g.strokeStyle = INK; g.stroke();
}
